<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b16">
  <meta name="description" content="Website telah berpindah ke koneksi HTTPS yang lebih aman.">

  <title>Website Telah Berpindah — Catur</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 20% 20%, rgba(59,130,246,.18), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(139,92,246,.18), transparent 30%),
        #050814;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Background */
    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      opacity: .5;
      animation: float 9s ease-in-out infinite;
    }

    .orb.one {
      width: 280px;
      height: 280px;
      background: #2563eb;
      left: -100px;
      top: -100px;
    }

    .orb.two {
      width: 220px;
      height: 220px;
      background: #7c3aed;
      right: -80px;
      bottom: -70px;
      animation-delay: -3s;
    }

    .orb.three {
      width: 100px;
      height: 100px;
      background: #06b6d4;
      left: 75%;
      top: 15%;
      opacity: .25;
      animation-delay: -5s;
    }

    @keyframes float {
      0%, 100% {
        transform: translate3d(0,0,0) scale(1);
      }

      50% {
        transform: translate3d(0,-25px,0) scale(1.08);
      }
    }

    /* Stars */
    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 1px);
      background-size: 55px 55px;
      opacity: .12;
      animation: starsMove 20s linear infinite;
    }

    @keyframes starsMove {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-55px);
      }
    }

    /* Main Card */
    .card {
      width: min(92%, 650px);
      padding: 48px 35px;
      text-align: center;
      position: relative;
      z-index: 2;

      background: rgba(12,18,35,.72);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 30px;

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 30px 80px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.06);

      animation: cardIn .9s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(35px) scale(.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Icon */
    .icon {
      width: 90px;
      height: 90px;
      margin: 0 auto 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 26px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);

      box-shadow:
        0 15px 40px rgba(37,99,235,.35);

      animation: iconFloat 3s ease-in-out infinite;
    }

    .icon svg {
      width: 45px;
      height: 45px;
      fill: none;
      stroke: white;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes iconFloat {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-8px) rotate(2deg);
      }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 8px 14px;
      margin-bottom: 18px;

      border-radius: 999px;
      background: rgba(34,197,94,.1);
      border: 1px solid rgba(34,197,94,.25);

      color: #86efac;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 12px #22c55e;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.5);
        opacity: .5;
      }
    }

    h1 {
      font-size: clamp(30px, 7vw, 50px);
      line-height: 1.1;
      letter-spacing: -1.8px;
      margin-bottom: 16px;
    }

    .gradient {
      background: linear-gradient(90deg, #60a5fa, #a78bfa, #22d3ee);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: gradientMove 4s linear infinite;
    }

    @keyframes gradientMove {
      to {
        background-position: 200% center;
      }
    }

    .description {
      max-width: 500px;
      margin: 0 auto 28px;
      color: #a8b2c7;
      font-size: 16px;
      line-height: 1.7;
    }

    /* New domain */
    .domain-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      width: fit-content;
      max-width: 100%;
      margin: 0 auto 28px;
      padding: 14px 20px;

      border-radius: 15px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.09);

      color: #fff;
      font-size: 17px;
      font-weight: 700;

      box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
    }

    .lock {
      width: 21px;
      height: 21px;
      stroke: #4ade80;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Button */
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      padding: 15px 25px;
      border-radius: 15px;

      color: white;
      text-decoration: none;
      font-weight: 800;
      font-size: 15px;

      background: linear-gradient(135deg, #2563eb, #7c3aed);

      box-shadow:
        0 12px 30px rgba(37,99,235,.28);

      transition:
        transform .25s ease,
        box-shadow .25s ease,
        filter .25s ease;
    }

    .button svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .button:hover {
      transform: translateY(-4px);
      box-shadow:
        0 18px 38px rgba(37,99,235,.4);
      filter: brightness(1.1);
    }

    .button:active {
      transform: scale(.96);
    }

    .security {
      margin-top: 25px;
      color: #718096;
      font-size: 12px;
    }

    .security strong {
      color: #86efac;
    }

    /* Decorative line */
    .line {
      width: 100px;
      height: 3px;
      margin: 0 auto 25px;
      border-radius: 20px;
      background: linear-gradient(90deg, #2563eb, #a78bfa);
      animation: linePulse 2s ease-in-out infinite;
    }

    @keyframes linePulse {
      0%, 100% {
        width: 80px;
        opacity: .6;
      }

      50% {
        width: 130px;
        opacity: 1;
      }
    }

    /* Particles */
    .particle {
      position: fixed;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,.7);
      pointer-events: none;
      animation: particleUp linear infinite;
    }

    @keyframes particleUp {
      from {
        transform: translateY(110vh);
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      85% {
        opacity: 1;
      }

      to {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }

    /* Mobile */
    @media (max-width: 600px) {
      .card {
        padding: 38px 22px;
        border-radius: 25px;
      }

      .icon {
        width: 78px;
        height: 78px;
        border-radius: 22px;
      }

      .icon svg {
        width: 39px;
        height: 39px;
      }

      .description {
        font-size: 14px;
      }

      .domain-box {
        font-size: 15px;
        padding: 13px 15px;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="stars"></div>
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
  </div>

  <!-- Particle -->
  <div class="particle" style="left:8%; animation-duration:9s; animation-delay:1s;"></div>
  <div class="particle" style="left:20%; animation-duration:13s; animation-delay:4s;"></div>
  <div class="particle" style="left:35%; animation-duration:11s; animation-delay:2s;"></div>
  <div class="particle" style="left:52%; animation-duration:15s; animation-delay:5s;"></div>
  <div class="particle" style="left:68%; animation-duration:10s; animation-delay:3s;"></div>
  <div class="particle" style="left:82%; animation-duration:14s; animation-delay:1s;"></div>
  <div class="particle" style="left:94%; animation-duration:12s; animation-delay:6s;"></div>

  <main class="card">

    <div class="icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 3l7 3v5c0 4.5-2.9 7.9-7 10-4.1-2.1-7-5.5-7-10V6l7-3z"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
    </div>

    <div class="badge">
      <span class="dot"></span>
      Website telah dipindahkan
    </div>

    <h1>
      Website Telah<br>
      <span class="gradient">Berpindah</span>
    </h1>

    <div class="line"></div>

    <p class="description">
      Website ini sekarang menggunakan koneksi <strong>HTTPS</strong>
      yang lebih aman. Silakan lanjutkan ke alamat website terbaru kami.
    </p>

    <div class="domain-box">
      <svg class="lock" viewBox="0 0 24 24">
        <rect x="5" y="10" width="14" height="11" rx="2"/>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
      </svg>

      https://catur.biz.id
    </div>

    <a
      class="button"
      href="https://catur.biz.id/"
    >
      Kunjungi Website
      <svg viewBox="0 0 24 24">
        <path d="M5 12h14"/>
        <path d="M13 6l6 6-6 6"/>
      </svg>
    </a>

    <div class="security">
      <strong>HTTPS </strong>
      · Koneksi lebih aman
    </div>

  </main>

  <script>
    // Efek gerak lembut kartu mengikuti posisi pointer
    const card = document.querySelector(".card");

    document.addEventListener("mousemove", (e) => {
      if (window.innerWidth < 700) return;

      const x = (e.clientX / window.innerWidth - 0.5) * 2;
      const y = (e.clientY / window.innerHeight - 0.5) * 2;

      card.style.transform =
        `perspective(1000px) rotateY(${x * 2}deg) rotateX(${y * -2}deg)`;
    });

    document.addEventListener("mouseleave", () => {
      card.style.transform =
        "perspective(1000px) rotateY(0deg) rotateX(0deg)";
    });

    // Jika tombol diklik, beri efek transisi sebelum pindah
    const button = document.querySelector(".button");

    button.addEventListener("click", (event) => {
      event.preventDefault();

      button.style.transform = "scale(.94)";

      setTimeout(() => {
        window.location.href = button.href;
      }, 180);
    });
  </script>

</body>
</html>
