<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>NEXORA: Shadow Realm</title>
<style>
:root{
  --bg:#05070f; --bg2:#0a0e1a; --panel:rgba(14,18,32,.92); --panel2:rgba(20,26,44,.9);
  --line:rgba(120,150,220,.18); --txt:#dfe7ff; --dim:#8a96b8; --acc:#5ad1ff; --acc2:#b06bff;
  --gold:#ffcb5c; --hp:#ff4d6d; --en:#5ad1ff; --xp:#7cff9c; --danger:#ff4d6d; --ok:#5cffb0;
  --radius:14px; --radius-s:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
  width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;
}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:auto;}

/* ============ SVG icon base ============ */
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.12em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.ic-f{fill:currentColor;stroke:none;}

/* ============ Overlay screens ============ */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:16px;z-index:20;background:radial-gradient(ellipse at 50% 30%,rgba(30,20,70,.65),rgba(3,5,12,.96) 70%);}
.screen.on{display:flex;animation:fadeIn .28s ease;}
.screen.abs-bg::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 20% 30%,rgba(90,209,255,.08),transparent 45%),
  radial-gradient(circle at 80% 70%,rgba(176,107,255,.08),transparent 45%);
  pointer-events:none;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Splash */
#splash{background:radial-gradient(ellipse at 50% 50%,#0a1024 0%,#02040a 80%);}
#splash .logo{width:min(78vw,420px);}
#splash .tag{margin-top:18px;color:var(--dim);letter-spacing:.35em;font-size:11px;text-transform:uppercase;}
#splash .tap{margin-top:38px;color:var(--acc);font-size:12px;letter-spacing:.25em;text-transform:uppercase;animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

/* Loading */
#loading .lwrap{width:min(88vw,420px);text-align:center;}
#loading .bar{height:8px;border-radius:6px;background:rgba(120,150,220,.14);overflow:hidden;margin-top:14px;}
#loading .bar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .22s ease;box-shadow:0 0 14px var(--acc);}
#loading .status{margin-top:12px;color:var(--dim);font-size:12px;letter-spacing:.08em;}

/* Logo */
.logo{display:flex;align-items:center;gap:12px;justify-content:center;}
.logo .mark{width:46px;height:46px;filter:drop-shadow(0 0 12px rgba(90,209,255,.65));}
.logo .txt{font-weight:800;letter-spacing:.14em;font-size:clamp(22px,6vw,34px);
  background:linear-gradient(90deg,#eaf3ff,var(--acc) 55%,var(--acc2));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.logo .sub{display:block;font-size:10px;letter-spacing:.5em;color:var(--dim);font-weight:600;margin-top:2px;text-transform:uppercase;}

/* Main Menu */
#menu{justify-content:flex-start;padding-top:max(26px,7vh);}
#menu .hero{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:22px;animation:slideUp .5s ease;}
#menu .hero .emblem{width:min(60vw,180px);height:auto;margin-bottom:8px;filter:drop-shadow(0 0 20px rgba(90,209,255,.5));}
.menu-grid{width:100%;max-width:440px;display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:0 4px;animation:slideUp .55s ease;}
.menu-btn{display:flex;align-items:center;gap:11px;padding:13px 13px;border-radius:var(--radius);
  background:linear-gradient(180deg,rgba(24,32,54,.88),rgba(12,16,30,.88));border:1px solid var(--line);
  color:var(--txt);font-size:13.5px;font-weight:600;cursor:pointer;transition:.14s;text-align:left;
  position:relative;overflow:hidden;letter-spacing:.02em;}
.menu-btn .ic{width:20px;height:20px;color:var(--acc);transition:.14s;}
.menu-btn:hover{transform:translateY(-1px);border-color:rgba(90,209,255,.4);background:linear-gradient(180deg,rgba(30,42,72,.9),rgba(16,22,42,.9));}
.menu-btn:active{transform:scale(.975);}
.menu-btn:hover .ic{color:var(--acc2);filter:drop-shadow(0 0 6px currentColor);}
.menu-btn.primary{grid-column:1/-1;background:linear-gradient(180deg,rgba(90,209,255,.2),rgba(60,90,180,.14));border-color:rgba(90,209,255,.45);}
.menu-btn.primary .ic{color:var(--acc);}
.menu-btn.danger .ic{color:var(--danger);}
.menu-btn.small{grid-column:span 1;padding:11px;}
.menu-foot{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:var(--dim);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;}

/* Panels */
.panel{width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 1px rgba(120,150,220,.06) inset;
  overflow:hidden;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:slideUp .25s ease;}
.panel.wide{max-width:640px;}
.panel-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(30,40,70,.55),transparent);}
.panel-head .ic{width:20px;height:20px;color:var(--acc);}
.panel-head h2{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;flex:1;}
.panel-body{padding:14px 16px;overflow-y:auto;overflow-x:hidden;flex:1;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
.panel-body::-webkit-scrollbar{width:6px;}
.panel-body::-webkit-scrollbar-thumb{background:rgba(120,150,220,.2);border-radius:4px;}
.panel-foot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:rgba(10,14,26,.6);}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:var(--radius-s);
  background:linear-gradient(180deg,rgba(40,52,86,.9),rgba(20,28,52,.9));border:1px solid var(--line);
  color:var(--txt);font-size:13px;font-weight:600;cursor:pointer;transition:.14s;letter-spacing:.03em;white-space:nowrap;}
.btn .ic{width:16px;height:16px;}
.btn:hover{border-color:rgba(90,209,255,.4);background:linear-gradient(180deg,rgba(50,66,108,.95),rgba(24,32,60,.95));}
.btn:active{transform:scale(.97);}
.btn.primary{background:linear-gradient(180deg,rgba(90,209,255,.9),rgba(60,120,220,.75));border-color:rgba(120,220,255,.6);color:#04121f;}
.btn.primary .ic{color:#04121f;}
.btn.danger{background:linear-gradient(180deg,rgba(255,77,109,.9),rgba(180,40,70,.75));border-color:rgba(255,120,140,.5);color:#1a0308;}
.btn.danger .ic{color:#1a0308;}
.btn.ghost{background:transparent;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn.full{width:100%;}
.btn.sm{padding:8px 12px;font-size:12px;}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.field label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600;}
.field input,.field select{width:100%;padding:11px 12px;border-radius:var(--radius-s);background:rgba(8,12,24,.9);
  border:1px solid var(--line);color:var(--txt);font-size:14px;font-family:inherit;outline:none;transition:.15s;}
.field input:focus,.field select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(90,209,255,.15);}
.field .pw-wrap{position:relative;}
.field .pw-wrap input{padding-right:42px;}
.field .pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:0;
  color:var(--dim);padding:8px;cursor:pointer;display:flex;align-items:center;}
.field .pw-toggle .ic{width:18px;height:18px;}
.field .hint{font-size:11px;color:var(--dim);}
.field .hint.err{color:var(--danger);}
.field .hint.ok{color:var(--ok);}

/* Class / selection cards */
.class-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px;}
.class-card{padding:12px 8px;border-radius:var(--radius-s);background:rgba(12,18,34,.85);border:1px solid var(--line);
  cursor:pointer;text-align:center;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:6px;}
.class-card:hover{border-color:rgba(90,209,255,.5);transform:translateY(-2px);}
.class-card.sel{border-color:var(--acc);background:linear-gradient(180deg,rgba(90,209,255,.16),rgba(20,30,60,.9));box-shadow:0 0 0 1px var(--acc) inset,0 0 20px rgba(90,209,255,.2);}
.class-card .glyph{width:34px;height:34px;color:var(--acc);}
.class-card .cname{font-size:12px;font-weight:700;letter-spacing:.08em;}
.class-card .cdesc{font-size:10px;color:var(--dim);line-height:1.35;}

/* Tabs */
.tabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;background:rgba(10,14,26,.35);}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:11px 13px;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--dim);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;transition:.15s;text-transform:uppercase;background:none;border-left:0;border-right:0;border-top:0;}
.tab.on{color:var(--acc);border-bottom-color:var(--acc);}
.tab:hover{color:var(--txt);}

/* Lists & items */
.list{display:flex;flex-direction:column;gap:7px;}
.row{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:var(--radius-s);
  background:rgba(12,18,34,.65);border:1px solid var(--line);transition:.13s;}
.row:hover{border-color:rgba(90,209,255,.35);background:rgba(18,26,48,.8);}
.row .ricon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:rgba(30,42,72,.8);flex:none;border:1px solid rgba(120,150,220,.15);}
.row .ricon .ic{width:18px;height:18px;color:var(--acc);}
.row .rmain{flex:1;min-width:0;}
.row .rtitle{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;}
.row .rsub{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.4;}
.row .ractions{display:flex;gap:6px;flex:none;}

/* Rarity colors */
.r-common{color:#9aa7c9}.r-uncommon{color:#5cffb0}.r-rare{color:#5ad1ff}
.r-epic{color:#b06bff}.r-legendary{color:#ffcb5c}.r-mythic{color:#ff5c8a}
.b-common{border-color:rgba(154,167,201,.35)}.b-uncommon{border-color:rgba(92,255,176,.4)}
.b-rare{border-color:rgba(90,209,255,.5)}.b-epic{border-color:rgba(176,107,255,.55)}
.b-legendary{border-color:rgba(255,203,92,.6)}.b-mythic{border-color:rgba(255,92,138,.65)}

/* Stats line */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.stat{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;
  background:rgba(12,18,34,.65);border:1px solid var(--line);font-size:12px;}
.stat .k{color:var(--dim);display:flex;align-items:center;gap:6px;}
.stat .k .ic{width:14px;height:14px;color:var(--acc);}
.stat .v{font-weight:700;}

/* Bars */
.bar{height:8px;border-radius:6px;background:rgba(120,150,220,.15);overflow:hidden;}
.bar>i{display:block;height:100%;transition:width .25s ease;}
.bar.hp>i{background:linear-gradient(90deg,#ff4d6d,#ff8098);}
.bar.en>i{background:linear-gradient(90deg,#5ad1ff,#8ce0ff);}
.bar.xp>i{background:linear-gradient(90deg,#7cff9c,#5cffb0);}
.bar.progress{height:6px;margin-top:6px;}
.bar.progress>i{background:linear-gradient(90deg,var(--acc),var(--acc2));}

/* Empty state */
.empty{padding:38px 16px;text-align:center;color:var(--dim);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.empty .ic{width:36px;height:36px;opacity:.35;}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(2,4,10,.72);display:none;align-items:center;justify-content:center;z-index:60;
  padding:18px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
.modal-bg.on{display:flex;animation:fadeIn .2s ease;}
.modal{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.7);animation:slideUp .22s ease;}
.modal h3{font-size:15px;margin-bottom:10px;letter-spacing:.05em;display:flex;align-items:center;gap:9px;}
.modal h3 .ic{width:20px;height:20px;color:var(--acc);}
.modal p{font-size:13px;color:var(--dim);line-height:1.55;margin-bottom:16px;}
.modal .btns{display:flex;gap:8px;}
.modal .btns .btn{flex:1;}

/* Toast */
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;
  pointer-events:none;width:min(92vw,380px);}
.toast{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--radius-s);
  background:rgba(14,18,32,.95);border:1px solid var(--line);font-size:12.5px;
  box-shadow:0 10px 30px rgba(0,0,0,.55);animation:slideUp .28s ease;pointer-events:auto;}
.toast .ic{width:18px;height:18px;color:var(--acc);flex:none;}
.toast.ok .ic{color:var(--ok);} .toast.warn .ic{color:var(--gold);} .toast.err .ic{color:var(--danger);}
.toast .msg{flex:1;line-height:1.4;}

/* HUD */
#hud{position:absolute;inset:0;display:none;z-index:10;pointer-events:none;}
#hud.on{display:block;}
.hud-tl{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));
  display:flex;gap:10px;align-items:center;}
.avatar{width:48px;height:48px;border-radius:12px;background:linear-gradient(180deg,rgba(90,209,255,.25),rgba(40,60,110,.6));
  border:1px solid rgba(90,209,255,.4);display:flex;align-items:center;justify-content:center;flex:none;position:relative;
  box-shadow:0 0 18px rgba(90,209,255,.25);}
.avatar .ic{width:26px;height:26px;color:var(--acc);}
.avatar .lv{position:absolute;bottom:-6px;right:-6px;background:var(--acc);color:#04121f;font-size:10px;font-weight:800;
  padding:2px 6px;border-radius:6px;border:2px solid #05070f;letter-spacing:.02em;}
.hud-bars{display:flex;flex-direction:column;gap:4px;width:min(46vw,200px);}
.hud-bars .bar{height:9px;background:rgba(6,9,18,.72);border:1px solid rgba(120,150,220,.2);}
.hud-txt{font-size:10px;color:var(--dim);display:flex;justify-content:space-between;letter-spacing:.04em;}
.hud-tr{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));
  display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.cur{display:flex;align-items:center;gap:5px;background:rgba(8,12,24,.78);border:1px solid var(--line);
  padding:5px 9px;border-radius:8px;font-size:11.5px;font-weight:600;}
.cur .ic{width:14px;height:14px;color:var(--gold);}
.cur.shard .ic{color:var(--acc2);}
.quest-mini{background:rgba(8,12,24,.78);border:1px solid var(--line);padding:6px 10px;border-radius:8px;
  font-size:11px;max-width:min(56vw,260px);}
.quest-mini .qn{color:var(--acc);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:9.5px;}
.quest-mini .qt{margin-top:2px;color:var(--txt);}
.quest-mini .qp{margin-top:3px;color:var(--dim);font-size:10px;}
.bossbar{position:absolute;top:64px;left:50%;transform:translateX(-50%);width:min(84vw,620px);display:none;}
.bossbar.on{display:block;animation:slideUp .35s ease;}
.bossbar .bname{text-align:center;font-size:12px;letter-spacing:.22em;font-weight:700;color:var(--hp);
  text-transform:uppercase;margin-bottom:5px;text-shadow:0 0 12px rgba(255,77,109,.6);}
.bossbar .bar{height:12px;background:rgba(6,9,18,.85);border:1px solid rgba(255,77,109,.4);}
.bossbar .bar>i{background:linear-gradient(90deg,#ff4d6d,#ff8a5c);}
.bossbar .phases{display:flex;justify-content:center;gap:4px;margin-top:5px;}
.bossbar .phases span{width:6px;height:6px;border-radius:50%;background:rgba(255,77,109,.25);}
.bossbar .phases span.on{background:var(--hp);box-shadow:0 0 8px var(--hp);}

/* Mobile controls */
#touch{position:absolute;inset:0;display:none;z-index:12;pointer-events:none;}
#touch.on{display:block;}
#joy{position:absolute;left:max(20px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));
  width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(30,42,72,.4),rgba(10,14,26,.15) 70%);
  border:1px solid rgba(120,150,220,.25);pointer-events:auto;touch-action:none;}
#joy .knob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 30% 30%,rgba(120,200,255,.85),rgba(60,110,200,.6));
  border:1px solid rgba(160,220,255,.5);box-shadow:0 0 22px rgba(90,209,255,.4);}
.tbtn{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 30%,rgba(60,80,140,.65),rgba(16,22,44,.75));
  border:1px solid rgba(120,150,220,.3);pointer-events:auto;touch-action:none;transition:.08s;
  color:var(--txt);box-shadow:0 4px 16px rgba(0,0,0,.4);}
.tbtn .ic{width:44%;height:44%;color:var(--acc);}
.tbtn.pressed{transform:scale(.9);background:radial-gradient(circle at 30% 30%,rgba(120,200,255,.7),rgba(50,90,170,.8));}
.tbtn.hit{background:radial-gradient(circle at 30% 30%,rgba(255,140,80,.85),rgba(180,60,30,.8));}
#t-attack{right:max(24px,env(safe-area-inset-right));bottom:max(120px,calc(env(safe-area-inset-bottom) + 120px));width:78px;height:78px;}
#t-heavy{right:max(112px,calc(env(safe-area-inset-right) + 112px));bottom:max(70px,calc(env(safe-area-inset-bottom) + 70px));width:62px;height:62px;}
#t-jump{right:max(24px,env(safe-area-inset-right));bottom:max(34px,calc(env(safe-area-inset-bottom) + 34px));width:70px;height:70px;}
#t-dash{right:max(112px,calc(env(safe-area-inset-right) + 112px));bottom:max(150px,calc(env(safe-area-inset-bottom) + 150px));width:56px;height:56px;}
#t-skill1{right:max(196px,calc(env(safe-area-inset-right) + 196px));bottom:max(50px,calc(env(safe-area-inset-bottom) + 50px));width:56px;height:56px;}
#t-skill2{right:max(196px,calc(env(safe-area-inset-right) + 196px));bottom:max(120px,calc(env(safe-area-inset-bottom) + 120px));width:56px;height:56px;}
#t-ulti{right:max(24px,env(safe-area-inset-right));bottom:max(206px,calc(env(safe-area-inset-bottom) + 206px));width:60px;height:60px;}
#t-ulti .ic{color:var(--gold);}
#t-pause{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));
  width:38px;height:38px;pointer-events:auto;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:rgba(8,12,24,.78);border:1px solid var(--line);}
#t-pause .ic{width:18px;height:18px;}
#t-ulti.ready{border-color:var(--gold);box-shadow:0 0 18px rgba(255,203,92,.6);animation:pulse 1.4s infinite;}

/* Floating damage numbers handled on canvas */

/* Scrollbar for panels */
.hidden{display:none !important;}

/* Selection highlight */
::selection{background:rgba(90,209,255,.35);}

/* Dialogue */
#dialogue{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);width:min(92vw,660px);
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:none;z-index:15;}
#dialogue.on{display:block;animation:slideUp .25s ease;}
#dialogue .dn{font-size:12px;font-weight:700;color:var(--acc);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;}
#dialogue .dt{font-size:14px;line-height:1.6;min-height:44px;}
#dialogue .dc{margin-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--dim);}
#dialogue .dc .cont{color:var(--acc);animation:pulse 1.4s infinite;}

/* ============ Landscape notice ============ */

<body>

<div id="app">
  <canvas id="game"></canvas>

  <!-- ============ HUD ============ -->
  <div id="hud">
    <div class="hud-tl">
      <div class="avatar"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg><span class="lv" id="hud-lv">1</span></div>
      <div class="hud-bars">
        <div class="bar hp"><i id="hud-hp" style="width:100%"></i></div>
        <div class="bar en"><i id="hud-en" style="width:100%"></i></div>
        <div class="bar xp"><i id="hud-xp" style="width:0%"></i></div>
      </div>
    </div>
    <div class="hud-tr">
      <div class="cur"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9h6M9 13h6"/></svg><span id="hud-cr">0</span></div>
      <div class="cur shard"><svg class="ic" viewBox="0 0 24 24"><path d="M12 2l4 7-4 13-4-13z"/></svg><span id="hud-sh">0</span></div>
      <div class="quest-mini" id="hud-quest"></div>
    </div>
    <div class="bossbar" id="bossbar">
      <div class="bname" id="boss-name">BOSS</div>
      <div class="bar"><i id="boss-hp" style="width:100%"></i></div>
      <div class="phases" id="boss-phases"></div>
    </div>
  </div>

  <!-- ============ Touch controls ============ -->
  <div id="touch">
    <div id="joy"><div class="knob" id="joy-knob"></div></div>
    <div class="tbtn" id="t-jump" aria-label="Jump"><svg class="ic" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
    <div class="tbtn" id="t-attack" aria-label="Attack"><svg class="ic" viewBox="0 0 24 24"><path d="M3 21l6-6M14 4l6 6-3 3-6-6z"/><path d="M6 18l5-5"/></svg></div>
    <div class="tbtn" id="t-heavy" aria-label="Heavy"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20L20 4M14 4h6v6"/><path d="M4 20l6-6"/></svg></div>
    <div class="tbtn" id="t-dash" aria-label="Dash"><svg class="ic" viewBox="0 0 24 24"><path d="M4 12h10M10 6l6 6-6 6"/></svg></div>
    <div class="tbtn" id="t-skill1" aria-label="Skill 1"><svg class="ic" viewBox="0 0 24 24"><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/><circle cx="12" cy="12" r="2.5"/></svg></div>
    <div class="tbtn" id="t-skill2" aria-label="Skill 2"><svg class="ic" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/><circle cx="12" cy="12" r="3"/></svg></div>
    <div class="tbtn" id="t-ulti" aria-label="Ultimate"><svg class="ic" viewBox="0 0 24 24"><path d="M12 2l3 7 7 1-5 5 1.5 7L12 18.5 5.5 22 7 15 2 10l7-1z"/></svg></div>
    <div id="t-pause" aria-label="Pause"><svg class="ic" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></div>
  </div>

  <!-- ============ Dialogue ============ -->
  <div id="dialogue">
    <div class="dn" id="d-name">—</div>
    <div class="dt" id="d-text"></div>
    <div class="dc"><span>Tap / Space</span><span class="cont">CONTINUE ▸</span></div>
  </div>

  <!-- ============ Splash ============ -->
  <div class="screen on" id="splash">
    <svg class="logo" viewBox="0 0 320 120">
      <defs>
        <linearGradient id="lg1" x1="0" x2="1"><stop offset="0" stop-color="#eaf3ff"/><stop offset="1" stop-color="#5ad1ff"/></linearGradient>
        <radialGradient id="rg1"><stop offset="0" stop-color="#5ad1ff" stop-opacity=".5"/><stop offset="1" stop-color="#5ad1ff" stop-opacity="0"/></radialGradient>
      </defs>
      <circle cx="160" cy="52" r="46" fill="url(#rg1)"/>
      <path d="M160 12 L188 52 L160 92 L132 52 Z" fill="none" stroke="url(#lg1)" stroke-width="2.5"/>
      <path d="M160 28 L174 52 L160 76 L146 52 Z" fill="url(#lg1)" opacity=".45"/>
      <text x="160" y="112" text-anchor="middle" font-size="14" letter-spacing="6" fill="#8a96b8" font-family="system-ui" font-weight="600">SHADOW REALM</text>
    </svg>
    <div class="tag">NEXORA</div>
    <div class="tap">Tap to continue</div>
  </div>

  <!-- ============ Loading ============ -->
  <div class="screen" id="loading">
    <div class="lwrap">
      <div class="logo"><svg class="mark" viewBox="0 0 24 24" fill="none" stroke="#5ad1ff" stroke-width="1.6"><path d="M12 2 L20 12 L12 22 L4 12 Z"/><path d="M12 6 L16 12 L12 18 L8 12 Z" opacity=".5"/></svg>
        <div><span class="txt">NEXORA</span><span class="sub">Shadow Realm</span></div></div>
      <div class="bar"><i id="load-bar"></i></div>
      <div class="status" id="load-status">Initializing…</div>
    </div>
  </div>

  <!-- ============ Main Menu ============ -->
  <div class="screen abs-bg" id="menu">
    <div class="hero">
      <svg class="emblem" viewBox="0 0 200 120">
        <defs><radialGradient id="eg"><stop offset="0" stop-color="#5ad1ff" stop-opacity=".45"/><stop offset="1" stop-color="#5ad1ff" stop-opacity="0"/></radialGradient></defs>
        <circle cx="100" cy="60" r="52" fill="url(#eg)"/>
        <path d="M100 18 L138 60 L100 102 L62 60 Z" fill="none" stroke="#5ad1ff" stroke-width="2"/>
        <path d="M100 34 L120 60 L100 86 L80 60 Z" fill="#5ad1ff" opacity=".25"/>
        <path d="M100 44 L110 60 L100 76 L90 60 Z" fill="#b06bff" opacity=".7"/>
      </svg>
      <div class="logo"><span class="txt">NEXORA</span></div>
      <div class="tag" style="color:var(--dim);letter-spacing:.4em;font-size:10px;margin-top:-4px">SHADOW REALM</div>
    </div>
    <div class="menu-grid" id="menu-grid"></div>
    <div class="menu-foot">v1.0 · Firebase Connected</div>
  </div>

  <!-- ============ Generic panel host ============ -->
  <div class="screen" id="panel-host" style="justify-content:center;padding:16px;overflow:auto;">
    <div class="panel wide" id="panel"></div>
  </div>

  <!-- ============ Character creation ============ -->
  <div class="screen" id="create">
    <div class="panel wide">
      <div class="panel-head">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        <h2>Create Character</h2>
      </div>
      <div class="panel-body">
        <div class="field">
          <label for="c-name">Character Name</label>
          <input id="c-name" maxlength="16" placeholder="Enter a name" autocomplete="off">
          <div class="hint" id="c-name-hint">3–16 characters</div>
        </div>
        <div class="field">
          <label>Choose Class</label>
          <div class="class-grid" id="class-grid"></div>
        </div>
        <div class="field">
          <label>Class Info</label>
          <div id="class-info" style="font-size:12px;color:var(--dim);line-height:1.55;padding:10px;background:rgba(12,18,34,.7);border:1px solid var(--line);border-radius:10px;"></div>
        </div>
      </div>
      <div class="panel-foot">
        <button class="btn ghost" id="c-back">Back</button>
        <button class="btn primary full" id="c-start">Begin Journey</button>
      </div>
    </div>
  </div>

  <!-- ============ Pause ============ -->
  <div class="screen" id="pause" style="background:rgba(2,4,10,.72);">
    <div class="panel" style="max-width:360px">
      <div class="panel-head"><svg class="ic" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg><h2>Paused</h2></div>
      <div class="panel-body">
        <div class="list" id="pause-list"></div>
      </div>
    </div>
  </div>

  <!-- ============ Toasts ============ -->
  <div id="toasts"></div>

  <!-- ============ Confirm modal ============ -->
  <div class="modal-bg" id="modal-bg">
    <div class="modal" id="modal"></div>
  </div>

  <!-- ============ Rotate notice ============ -->
  <div id="rotate">
    <svg class="ic" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M12 18h.01"/></svg>
    <p>Untuk pengalaman terbaik, putar perangkat ke mode <b>landscape</b>.</p>
  </div>
</div>

const lerp = (a,b,t) => a + (b-a)*t;

const iconSvg = (name, cls='') => { const s = (ICONS[name]||'').replace('<svg class="ic','<svg class="'+(cls||'ic')+'"'); return s; };
const fmt = n => { n=Math.floor(n); if(n>=1e6) return (n/1e6).toFixed(1)+'M'; if(n>=1e3) return (n/1e3).toFixed(1)+'K'; return String(n); };
const fmtTime = s => { s=Math.floor(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60; return (h?h+'h ':'')+m+'m '+ss+'s'; };

const AudioMan = {
  ctx:null, master:null, musicGain:null, sfxGain:null, uiGain:null,
  _music:null, _musicTimer:null, _trackId:null, enabled:false,
  init(){
    if(this.ctx) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.musicGain = this.ctx.createGain();
      this.sfxGain = this.ctx.createGain();
      this.uiGain = this.ctx.createGain();
      this.master.connect(this.ctx.destination);
      this.musicGain.connect(this.master);
      this.sfxGain.connect(this.master);
      this.uiGain.connect(this.master);
      this.apply();
      this.enabled = true;
    }catch(e){ console.warn('Audio init failed', e); }
  },
  apply(){
    const s = SaveMan.settings;
    this.master.gain.value = s.master*0.9;
    this.musicGain.gain.value = s.music*0.55;
    this.sfxGain.gain.value = s.sfx*0.6;
    this.uiGain.gain.value = s.ui*0.5;
  },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  beep(freq=440, dur=0.08, type='sine', gain=0.15, chan='sfx', slide){
    if(!this.enabled || !SaveMan.settings.sfx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if(slide!=null) o.frequency.exponentialRampToValueAtTime(Math.max(60,slide), t+dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(chan==='ui'?this.uiGain:this.sfxGain);
    o.start(t); o.stop(t+dur+0.02);
  },
  ui(){ this.beep(660, 0.05, 'triangle', 0.13, 'ui'); },
  hit(){ this.beep(180, 0.07, 'square', 0.18, 'sfx', 80); },
  slash(){ this.beep(520, 0.06, 'sawtooth', 0.1, 'sfx', 200); },
  levelup(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.beep(f,0.18,'triangle',0.16),i*90)); },
  boss(){ [110,80,140,90].forEach((f,i)=>setTimeout(()=>this.beep(f,0.4,'sawtooth',0.18),i*220)); },
  pickup(){ this.beep(880, 0.08, 'triangle', 0.12, 'ui'); setTimeout(()=>this.beep(1180,0.08,'triangle',0.12,'ui'),60); },
  die(){ this.beep(300,0.5,'sawtooth',0.2,'sfx',60); },
  // Simple music: repeating arpeggio
  _playMusic(scale=[220,262,330,392,440,392,330,262], interval=0.42, kind='music'){
    if(!this.enabled) return;
    clearInterval(this._musicTimer);
    const ctx = this.ctx;
    let i=0;
    const play = ()=>{
      if(!SaveMan.settings.music) return;
      const t = ctx.currentTime;
      const f = scale[i%scale.length];
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type='triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0, t);
      g.gain.linearRampToValueAtTime(0.10, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t+interval*0.9);
      o.connect(g); g.connect(this.musicGain);
      o.start(t); o.stop(t+interval);
      // bass
      if(i%4===0){
        const b = ctx.createOscillator(), bg = ctx.createGain();
        b.type='sine'; b.frequency.value = f/2;
        bg.gain.setValueAtTime(0.0, t);
        bg.gain.linearRampToValueAtTime(0.14, t+0.02);
        bg.gain.exponentialRampToValueAtTime(0.001, t+interval*3.4);
        b.connect(bg); bg.connect(this.musicGain);
        b.start(t); b.stop(t+interval*3.5);
      }
      i++;
    };
    play();
    this._musicTimer = setInterval(play, interval*1000);
  },
  playTrack(id){
    if(this._trackId === id) return;
    this._trackId = id;
    if(id==='village')   this._playMusic([261,329,392,523,392,329,261,196], 0.46);
    else if(id==='forest')   this._playMusic([220,261,329,349,329,261,220,196], 0.5);
    else if(id==='cavern')   this._playMusic([196,246,294,349,294,246,196,147], 0.52);
    else if(id==='city')     this._playMusic([174,220,261,329,261,220,174,131], 0.48);
    else if(id==='fortress') this._playMusic([146,196,233,294,233,196,146,110], 0.5);

    const d = DEFAULT_STATE();

    s.level = clamp(num(s.level,1),1,GAME_CONFIG.levelCap);

    s.shards = clamp(num(s.shards,0),0,999999999);
    s.skillPoints = clamp(num(s.skillPoints,0),0,999);
    s.inventory = Array.isArray(s.inventory)? s.inventory.filter(i=>i && ITEMS[i.id]).map(i=>({id:i.id, qty:clamp(num(i.qty,1),1,9999), uid:i.uid||uid()})) : [];
    s.skills = Array.isArray(s.skills)? s.skills.filter(k=>SKILLS[k]) : ['slash'];
    s.achievements = Array.isArray(s.achievements)? s.achievements.filter(a=>ACHIEVEMENTS.find(x=>x.id===a)) : [];
    s.quests = (s.quests && typeof s.quests==='object')? s.quests : {};

    s.equipped = Object.assign({weapon:null,armor:null,accessory:null}, s.equipped||{});

      // try backup
      try{ raw = localStorage.getItem(GAME_CONFIG.backupKey); }catch(e){}
    }
    if(!raw){ return null; }
    try{
      const s = JSON.parse(raw);
      return this.validate(s);
    }catch(e){
      // corrupted - try backup
      try{
        const bak = localStorage.getItem(GAME_CONFIG.backupKey);
        if(bak){ Toasts.show('Save corrupted, loaded backup.', 'warn', 'warning'); return this.validate(JSON.parse(bak)); }

      return null;
    }
  },
  save(silent=false){
    if(!this.state) return;

    try{
      const old = localStorage.getItem(GAME_CONFIG.saveKey);

      localStorage.setItem(GAME_CONFIG.saveKey, JSON.stringify(this.state));
      this._dirty = false;
      if(!silent) this.showSaveIndicator();
      if(!this.isGuest && this.user && this.online) this.cloudSave();
    }catch(e){
      console.warn('Save failed', e);
      if(!silent) Toasts.show('Save failed (storage full?)', 'err', 'error');

  },
  cloudSave(){
    if(!FirebaseMan.ready || !this.user) return;
    FirebaseMan.saveProgress(this.user.uid, this.state)
      .then(()=>{ /* synced */ })
      .catch(()=>{ Toasts.show('Cloud save pending', 'warn', 'warning'); });

    t.style.position='fixed'; t.style.bottom='12%'; t.style.left='50%'; t.style.transform='translateX(-50%)';
    t.style.zIndex=75; t.style.minWidth='120px'; t.style.justifyContent='center';
    document.body.appendChild(t);
    setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),320); }, 900);
  },
  newGame(){
    const s = DEFAULT_STATE();
    this.state = s;
    return s;
  },
  reset(){
    try{ localStorage.removeItem(GAME_CONFIG.saveKey); localStorage.removeItem(GAME_CONFIG.backupKey); }catch(e){}
    this.state = null;
  }
};

    }catch(e){
      console.warn('Firebase init failed (offline mode)', e);
      this.ready = false;

    }
  },
  async usernameAvailable(name){
    if(!this.ready) return {ok:true, offline:true};
    try{
      const snap = await this.api.get(this.api.ref(this.db, 'usernames/'+name.toLowerCase()));
      return {ok: !snap.exists()};
    }catch(e){ return {ok:true, offline:true}; }
  },
  async register({username, password, email}){
    if(!this.ready) throw new Error('offline');
    const uid = 'u_' + uid();
    const unameLower = username.toLowerCase();
    const avail = await this.usernameAvailable(username);
    if(!avail.ok) throw new Error('Username already taken.');
    // Hash password (client-side basic, note: production should use Firebase Auth)
    const pwHash = await this.hash(password + '::' + uid);
    await this.api.set(this.api.ref(this.db, 'users/'+uid), {
      uid, username, email: email||'', pwHash,
      createdAt: this.api.serverTimestamp ? Date.now() : Date.now(),
      progress: null
    });
    await this.api.set(this.api.ref(this.db, 'usernames/'+unameLower), uid);
    return {uid, username};
  },
  async login({username, password}){
    if(!this.ready) throw new Error('offline');
    const snap = await this.api.get(this.api.ref(this.db, 'usernames/'+username.toLowerCase()));
    if(!snap.exists()) throw new Error('User not found.');
    const uid = snap.val();
    const uSnap = await this.api.get(this.api.ref(this.db, 'users/'+uid));
    if(!uSnap.exists()) throw new Error('User data missing.');
    const user = uSnap.val();
    const pwHash = await this.hash(password + '::' + uid);
    if(pwHash !== user.pwHash) throw new Error('Incorrect password.');
    return {uid, username:user.username, email:user.email};
  },
  async hash(str){
    if(window.crypto && crypto.subtle){
      const buf = new TextEncoder().encode(str);
      const h = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
    // fallback simple hash
    let h=0; for(let i=0;i<str.length;i++){ h = ((h<<5)-h) + str.charCodeAt(i); h|=0; }
    return 'fb' + (h>>>0).toString(16);
  },
  async saveProgress(uid, state){
    if(!this.ready) throw new Error('offline');
    const clean = JSON.parse(JSON.stringify(state));
    await this.api.set(this.api.ref(this.db, 'users/'+uid+'/progress'), clean);
    await this.api.set(this.api.ref(this.db, 'users/'+uid+'/updatedAt'), Date.now());

    await this.api.update(this.api.ref(this.db, 'leaderboard/'+uid), {
      username: state.name,
      level: state.level,
      xp: state.xp,

      updatedAt: Date.now()
    });
  },

    if(!this.ready) throw new Error('offline');

    if(!this.ready) throw new Error('offline');

    if(!snap.exists()) return [];
    const arr = [];
    snap.forEach(c=>{ arr.push({uid:c.key, ...c.val()}); });
    return arr;
  }
};

const Particles = {
  pool: [], active: [], max: 400,
  init(){
    for(let i=0;i<this.max;i++) this.pool.push({x:0,y:0,vx:0,vy:0,life:0,max:1,size:2,color:'#fff',kind:'spark',grav:0});
  },
  emit(cfg){
    if(SaveMan.settings.particles<=0) return;
    if(this.active.length>=this.max*SaveMan.settings.particles) return;
    const p = this.pool.pop() || {x:0,y:0,vx:0,vy:0,life:0,max:1,size:2,color:'#fff',kind:'spark',grav:0};
    Object.assign(p, {
      x:cfg.x||0, y:cfg.y||0,
      vx:cfg.vx||0, vy:cfg.vy||0,
      life:cfg.life||0.5, max:cfg.life||0.5,
      size:cfg.size||3, color:cfg.color||'#5ad1ff', kind:cfg.kind||'spark',
      grav:cfg.grav||0
    });
    this.active.push(p);
  },
  burst(x, y, n, opts={}){
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2;
      const s = rand(opts.smin||40, opts.smax||260);
      this.emit({
        x, y,
        vx:Math.cos(a)*s, vy:Math.sin(a)*s - (opts.up||0),
        life:rand(opts.lmin||0.3, opts.lmax||0.8),
        size:rand(opts.szMin||2, opts.szMax||5),
        color:opts.color || '#5ad1ff', kind:opts.kind||'spark',
        grav:opts.grav!=null?opts.grav:800
      });
    }
  },
  update(dt){
    for(let i=this.active.length-1;i>=0;i--){
      const p = this.active[i];
      p.life -= dt;
      if(p.life<=0){ this.pool.push(p); this.active.splice(i,1); continue; }
      p.vy += p.grav*dt;
      p.x += p.vx*dt; p.y += p.vy*dt;
    }
  },
  draw(ctx, cam){
    const q = SaveMan.settings.quality;
    for(const p of this.active){
      const a = p.life/p.max;
      const sx = p.x - cam.x, sy = p.y - cam.y;
      if(sx<-20||sx>cam.w+20||sy<-20||sy>cam.h+20) continue;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      if(p.kind==='spark' && q!=='performance'){
        ctx.shadowColor = p.color; ctx.shadowBlur = 8;
      }
      const s = p.size * (0.4 + a*0.6);
      ctx.fillRect(sx-s/2, sy-s/2, s, s);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }
};

const Input = {
  keys: {}, justPressed: {},
  touch: { left:false, right:false, jump:false, attack:false, heavy:false, dash:false, s1:false, s2:false, ulti:false, interact:false },
  joy: { active:false, x:0, y:0, ax:0, ay:0, id:null, ox:0, oy:0 },
  keymap: { left:'a', right:'d', jump:' ', jump2:'w', attack:'j', heavy:'k', dash:'l', s1:'1', s2:'2', ulti:'3', interact:'e' },

  init(){
    window.addEventListener('keydown', e=>{
      const k = e.key.toLowerCase();
      if(!this.keys[k]) this.justPressed[k]=true;
      this.keys[k]=true;
      if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
    });
    window.addEventListener('keyup', e=>{ this.keys[e.key.toLowerCase()]=false; });
    window.addEventListener('blur', ()=>{ this.keys={}; });

    // Touch joystick
    const joy = $('#joy'), knob = $('#joy-knob');
    const setJoy = (clientX, clientY)=>{
      const r = joy.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      let dx = clientX - cx, dy = clientY - cy;
      const max = r.width*0.42;
      const d = Math.hypot(dx,dy);
      if(d>max){ dx = dx/d*max; dy = dy/d*max; }
      knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      this.joy.ax = dx/max; this.joy.ay = dy/max;
    };
    joy.addEventListener('pointerdown', e=>{
      e.preventDefault();
      this.joy.active=true; this.joy.id=e.pointerId;
      try{ joy.setPointerCapture(e.pointerId); }catch(_){}
      setJoy(e.clientX, e.clientY);
    });
    joy.addEventListener('pointermove', e=>{
      if(!this.joy.active || e.pointerId!==this.joy.id) return;
      e.preventDefault();
      setJoy(e.clientX, e.clientY);
    });
    const endJoy = e=>{
      if(e.pointerId!==this.joy.id) return;
      this.joy.active=false; this.joy.ax=0; this.joy.ay=0;
      knob.style.transform = 'translate(-50%,-50%)';
    };
    joy.addEventListener('pointerup', endJoy);
    joy.addEventListener('pointercancel', endJoy);

    // Buttons
    const bindBtn = (id, name)=>{
      const b = document.getElementById(id);
      if(!b) return;
      const down = e=>{
        e.preventDefault();
        b.classList.add('pressed');
        this.touch[name]=true;
        if(name==='attack') this.touch.attackPending = true;
        if(name==='heavy') this.touch.heavyPending = true;
        if(name==='jump') this.touch.jumpPending = true;
        if(name==='dash') this.touch.dashPending = true;
        if(name==='s1') this.touch.s1Pending = true;
        if(name==='s2') this.touch.s2Pending = true;
        if(name==='ulti') this.touch.ultiPending = true;
        if(SaveMan.settings.vibration && navigator.vibrate) navigator.vibrate(8);
        AudioMan.resume();
      };
      const up = e=>{ b.classList.remove('pressed'); this.touch[name]=false; };
      b.addEventListener('pointerdown', down);
      b.addEventListener('pointerup', up);
      b.addEventListener('pointercancel', up);
      b.addEventListener('pointerleave', up);
    };
    bindBtn('t-attack','attack');
    bindBtn('t-heavy','heavy');
    bindBtn('t-jump','jump');
    bindBtn('t-dash','dash');
    bindBtn('t-skill1','s1');
    bindBtn('t-skill2','s2');
    bindBtn('t-ulti','ulti');
    $('#t-pause').addEventListener('pointerdown', e=>{ e.preventDefault(); AudioMan.ui(); Game.togglePause(); });
  },
  down(...names){ return names.some(n=> this.keys[this.keymap[n]]); },
  pressed(...names){ return names.some(n=> this.justPressed[this.keymap[n]]); },
  consume(name){ const k=this.keymap[name]; if(this.justPressed[k]){ this.justPressed[k]=false; return true; } return false; },
  consumeTouch(name){ const k = name+'Pending'; if(this.touch[k]){ this.touch[k]=false; return true; } return false; },
  endFrame(){ this.justPressed = {}; this.touch.attackPending=false; this.touch.heavyPending=false; this.touch.jumpPending=false; this.touch.dashPending=false; this.touch.s1Pending=false; this.touch.s2Pending=false; this.touch.ultiPending=false; },
  // Unified
  axisX(){
    let x = 0;
    if(this.down('left')) x -= 1;
    if(this.down('right')) x += 1;
    if(Math.abs(this.joy.ax)>0.15) x = clamp(this.joy.ax*1.6, -1, 1);
    return clamp(x,-1,1);
  },
  jumpHeld(){ return this.keys[this.keymap.jump] || this.keys[this.keymap.jump2] || this.touch.jump; },
  wantsJump(){ return this.consume('jump') || this.consume('jump2') || this.consumeTouch('jump'); },
  wantsAttack(){ return this.consume('attack') || this.consumeTouch('attack'); },
  wantsHeavy(){ return this.consume('heavy') || this.consumeTouch('heavy'); },
  wantsDash(){ return this.consume('dash') || this.consumeTouch('dash'); },
  wantsS1(){ return this.consume('s1') || this.consumeTouch('s1'); },
  wantsS2(){ return this.consume('s2') || this.consumeTouch('s2'); },
  wantsUlti(){ return this.consume('ulti') || this.consumeTouch('ulti'); },
};

const World = {
  region: null, platforms: [], enemies: [], chests: [], checkpoints: [], boss:null,
  regionIndex: 0, width: 0, groundY: 0,
  load(idx){
    const r = REGIONS[idx];
    this.regionIndex = idx;
    this.region = r;
    this.width = r.width; this.groundY = r.groundY;
    // ground + walls
    this.platforms = [
      {x:-60, y:r.groundY, w:r.width+120, h:120, type:'ground'},
      {x:-60, y:-100, w:20, h:r.groundY+120, type:'wall'},
      {x:r.width+40, y:-100, w:20, h:r.groundY+120, type:'wall'},
    ];
    for(const p of r.platforms){
      this.platforms.push({x:p[0], y:p[1], w:p[2], h:p[3], type:'plat'});
    }
    // enemies
    this.enemies = r.enemies.map(e => spawnEnemy(e.t, e.x, e.y));
    // chests
    this.chests = r.chests.map(c => ({x:c.x, y:c.y, w:26, h:22, opened:false, id:uid()}));
    // checkpoint
    this.checkpoints = [{x: r.checkpointX, y: r.groundY-40, w:30, h:44, active: (SaveMan.state?.checkpoint?.region===idx), region:idx}];
    // boss
    if(r.boss && !SaveMan.state.bossDefeated[r.boss]){
      this.boss = spawnBoss(r.boss, r.bossX, r.groundY-40);
    } else { this.boss = null; }
  },
  draw(ctx, cam){
    const r = this.region;
    const q = SaveMan.settings.quality;
    // sky
    const g = ctx.createLinearGradient(0,0,0,cam.h);
    g.addColorStop(0, r.palette[0]); g.addColorStop(0.6, r.palette[1]); g.addColorStop(1, r.palette[2]);
    ctx.fillStyle = g; ctx.fillRect(0,0,cam.w, cam.h);

    // parallax mountains
    ctx.save();
    ctx.globalAlpha = 0.55;
    const px = -cam.x*0.15;
    ctx.fillStyle = r.palette[2];
    for(let i=0;i<20;i++){
      const mx = px + i*340;
      if(mx>cam.w+200 || mx<-400) continue;
      ctx.beginPath();
      ctx.moveTo(mx, cam.h*0.7);
      ctx.lineTo(mx+170, cam.h*0.4);
      ctx.lineTo(mx+340, cam.h*0.7);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    // mid trees / pillars
    ctx.save();
    ctx.globalAlpha = 0.75;
    const tx = -cam.x*0.4;
    ctx.fillStyle = r.palette[2];
    for(let i=0;i<40;i++){
      const x = tx + i*220;
      if(x>cam.w+120 || x<-160) continue;
      const h = 90 + (i*37 % 60);
      if(r.id==='city' || r.id==='fortress'){
        ctx.fillRect(x, cam.h-120-h, 34, h+120);
      } else {
        ctx.beginPath();
        ctx.moveTo(x-30, cam.h-90);
        ctx.lineTo(x, cam.h-90-h);
        ctx.lineTo(x+30, cam.h-90);
        ctx.closePath(); ctx.fill();
        ctx.fillRect(x-4, cam.h-90, 8, 90);
      }
    }
    ctx.restore();

    // ambient floating particles
    if(q!=='performance'){
      const t = performance.now()*0.001;
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = r.accent;
      for(let i=0;i<30;i++){
        const x = ((i*173 + t*20) % (cam.w+80)) ;
        const y = ((i*97 + Math.sin(t*0.8 + i)*30) % cam.h);
        ctx.fillRect(x-1, y-1, 2, 2);
      }
      ctx.restore();
    }

    // platforms
    for(const p of this.platforms){
      const sx = p.x - cam.x, sy = p.y - cam.y;
      if(sx+p.w<-40||sx>cam.w+40) continue;
      if(p.type==='ground'){
        const gg = ctx.createLinearGradient(0,sy,0,sy+p.h);
        gg.addColorStop(0, r.palette[2]);
        gg.addColorStop(1, r.palette[1]);
        ctx.fillStyle = gg; ctx.fillRect(sx, sy, p.w, p.h);
        // edge line
        ctx.strokeStyle = r.accent; ctx.globalAlpha=0.55; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(sx, sy+1); ctx.lineTo(sx+p.w, sy+1); ctx.stroke();
        ctx.globalAlpha=1;
      } else if(p.type==='plat'){
        ctx.fillStyle = r.palette[2];
        ctx.fillRect(sx, sy, p.w, p.h);
        ctx.strokeStyle = r.accent; ctx.globalAlpha=0.6;
        ctx.beginPath(); ctx.moveTo(sx, sy+0.5); ctx.lineTo(sx+p.w, sy+0.5); ctx.stroke();
        ctx.globalAlpha=1;
      } else if(p.type==='wall'){
        // invisible
      }
    }

    // checkpoint
    for(const c of this.checkpoints){
      const sx = c.x - cam.x, sy = c.y - cam.y;
      ctx.save();
      ctx.fillStyle = c.active ? '#7cffb0' : '#8a96b8';
      ctx.fillRect(sx, sy, 3, c.h);
      ctx.beginPath();
      ctx.arc(sx+1.5, sy-4, 6, 0, Math.PI*2);
      if(c.active){ ctx.shadowColor = '#7cffb0'; ctx.shadowBlur = 12; }
      ctx.fill();
      ctx.restore();
      // pulse ring
      if(!c.active){
        const t = performance.now()*0.003;
        ctx.strokeStyle = 'rgba(124,255,176,'+(0.5+Math.sin(t)*0.3)+')';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(sx+1.5, sy+c.h/2, 18 + Math.sin(t)*4, 0, Math.PI*2); ctx.stroke();
      }
    }

    // chests
    for(const c of this.chests){
      const sx = c.x - cam.x, sy = c.y - cam.y;
      ctx.fillStyle = c.opened ? '#3a4468' : '#ffcb5c';
      ctx.fillRect(sx, sy, c.w, c.h);
      ctx.strokeStyle = c.opened ? '#586080' : '#a07010';
      ctx.lineWidth = 1.5; ctx.strokeRect(sx+0.5, sy+0.5, c.w-1, c.h-1);
      if(!c.opened){
        const t = performance.now()*0.004;
        ctx.strokeStyle = 'rgba(255,203,92,'+(0.5+Math.sin(t)*0.35)+')';
        ctx.beginPath(); ctx.arc(sx+c.w/2, sy+c.h/2, 18 + Math.sin(t)*3, 0, Math.PI*2); ctx.stroke();
      }
    }

    // chest prompt
    const nearChest = this.chests.find(c=>!c.opened && Math.abs((Player.x+Player.w/2) - (c.x+c.w/2)) < 40 && Math.abs((Player.y+Player.h) - (c.y+c.h)) < 60);
    if(nearChest){
      const sx = nearChest.x - cam.x + 13, sy = nearChest.y - cam.y - 16;
      ctx.fillStyle = 'rgba(8,12,24,.9)';
      ctx.fillRect(sx-34, sy-16, 68, 22);
      ctx.strokeStyle = '#5ad1ff'; ctx.strokeRect(sx-34, sy-16, 68, 22);
      ctx.fillStyle = '#dfe7ff'; ctx.font = '11px system-ui'; ctx.textAlign='center';
      ctx.fillText(Input.touch.interact ? 'TAP ICON' : 'E  OPEN', sx, sy-1);
    }
  }
};

// ---------------------------------------------------------------
// ENEMY FACTORY
// ---------------------------------------------------------------
function spawnEnemy(typeKey, x, y){
  const t = ENEMY_TYPES[typeKey];
  const isElite = Math.random() < 0.14;
  const mul = isElite ? 1.9 : 1;
  return {
    type: typeKey, def: t,
    x, y, w: t.w, h: t.h,
    vx:0, vy:0, onGround:false, facing:1,
    hp: t.hp*mul, hpMax: t.hp*mul,
    atk: t.atk*(isElite?1.35:1), defVal: t.def*(isElite?1.4:1),
    spd: t.spd*(isElite?1.1:1),
    xp: Math.floor(t.xp*mul), credit: Math.floor(t.credit*mul),
    elite: isElite,
    state:'idle', stateTime:0, alertTimer:0, patrolDir: Math.random()<0.5?-1:1,
    patrolTimer: 0, attackCd: 0, staggerT: 0, hurtT: 0,
    animT: Math.random()*10, dead:false, invuln: 0,
    spawnX: x, spawnY: y, jumpCd:0,
  };
}

function spawnBoss(key, x, y){
  const b = BOSSES[key];
  return {
    key, name:b.name, x, y, w:b.w, h:b.h,
    vx:0, vy:0, onGround:false, facing:-1,
    hp:b.hp, hpMax:b.hp, atk:b.atk, defVal:b.def,
    xp:b.xp, credit:b.credit,
    phase:0, state:'intro', stateTime:0, attackCd:0, telegraph:0, telegraphType:null,
    staggerT:0, hurtT:0, animT:0, dead:false, invuln:0, active:false,
    bulletCd: 0, summonCd:0, slamCd:0,
  };
}

// ---------------------------------------------------------------
// PLAYER
// ---------------------------------------------------------------
const Player = {
  x:0, y:0, w:24, h:32, vx:0, vy:0,
  onGround:false, facing:1, animT:0,
  coyote:0, jumpBuffer:0, jumpsLeft:0, maxJumps:2,
  dashT:0, dashCd:0, invuln:0,
  attackT:0, attackCd:0, comboIndex:0, comboTimer:0, hitTargets:new Set(),
  heavyT:0, heavyCd:0,
  ultiCharge:0, ultiReady:false, ultiT:0,
  skillCd: {}, buffs:{}, hurtFlash:0,
  hp:100, hpMax:100, en:60, enMax:60,
  level:1, xp:0, credits:0, shards:0,
  buffed: {},
  // config
  spdBase: 200, atkBase: 10, defBase: 10, critBase: 0.1, critDmgBase: 1.6, skillPowerBase: 1.0,

  init(s){
    this.x = s.checkpoint?.x ?? 200;
    this.y = (s.checkpoint?.y ?? 520);
    this.facing = 1;
    this.vx = 0; this.vy = 0;
  },
  stats(){
    const s = SaveMan.state;
    const c = CLASSES[s.cls];
    let atk = c.atk, def = c.def, spd = c.spd, crit = c.crit, critDmg = c.critDmg, skillPower = c.skillPower;
    let hpMax = c.hp + (s.level-1)*12;
    let enMax = c.energy + (s.level-1)*6;
    for(const slot of ['weapon','armor','accessory']){
      const uidE = s.equipped[slot];
      if(!uidE) continue;
      const inv = s.inventory.find(i=>i.uid===uidE);
      if(!inv) continue;
      const it = ITEMS[inv.id];
      if(!it) continue;
      atk += it.atk||0; def += it.def||0; spd += it.spd||0;
      crit += it.crit||0; critDmg += it.critDmg||0; skillPower += it.skillPower||0;
      hpMax += it.hp||0;
    }
    // buffs
    for(const k in this.buffed){
      const b = this.buffed[k];
      if(b.expires < performance.now()/1000) { delete this.buffed[k]; continue; }
      if(b.type==='def') def *= b.val;
      if(b.type==='spd') spd *= b.val;
    }
    return {atk, def, spd, crit, critDmg, skillPower, hpMax, enMax};
  },
  update(dt){
    const s = SaveMan.state;
    const st = this.stats();
    this.hpMax = st.hpMax; this.enMax = st.enMax;
    // regen energy
    this.en = Math.min(this.enMax, this.en + 6*dt);
    // buffs tick
    for(const k in this.buffed){ if(this.buffed[k].expires < performance.now()/1000) delete this.buffed[k]; }
    // invuln
    if(this.invuln>0) this.invuln-=dt;
    if(this.hurtFlash>0) this.hurtFlash-=dt;
    // cooldowns
    if(this.dashCd>0) this.dashCd-=dt;
    if(this.attackCd>0) this.attackCd-=dt;
    if(this.heavyCd>0) this.heavyCd-=dt;
    if(this.ultiT>0) this.ultiT-=dt;
    for(const k in this.skillCd){ if(this.skillCd[k]>0) this.skillCd[k]-=dt; }
    // combo timer
    if(this.comboTimer>0){ this.comboTimer-=dt; if(this.comboTimer<=0){ this.comboIndex=0; } }

    // dead check
    if(this.hp<=0){ Game.onPlayerDeath(); return; }

    // ---- Movement
    const ax = Input.axisX();
    const moveSpd = st.spd;
    if(ax!==0){
      this.facing = ax>0?1:-1;
      if(this.onGround) this.vx = lerp(this.vx, ax*moveSpd, 1 - Math.pow(0.0001, dt));
      else this.vx = lerp(this.vx, ax*moveSpd*0.85, 1 - Math.pow(0.0008, dt));
    } else {
      const fric = this.onGround ? 12 : 4;
      this.vx = lerp(this.vx, 0, 1 - Math.exp(-fric*dt));
    }
    // dust when moving fast on ground
    if(this.onGround && Math.abs(this.vx)>120 && Math.random()<0.4){
      Particles.emit({x:this.x+this.w/2, y:this.y+this.h, vx:rand(-20,20), vy:rand(-40,-10), life:0.4, size:2.5, color:'rgba(180,200,230,.8)'});
    }

    // ---- Jump
    const jumpJust = Input.wantsJump();
    if(jumpJust) this.jumpBuffer = GAME_CONFIG.jumpBufferTime;
    if(this.jumpBuffer>0) this.jumpBuffer -= dt;
    if(this.onGround){ this.coyote = GAME_CONFIG.coyoteTime; this.jumpsLeft = this.maxJumps; }
    else if(this.coyote>0){ this.coyote -= dt; }
    if(this.jumpBuffer>0 && (this.onGround || this.coyote>0 || (s.skills.includes('doublejump') && this.jumpsLeft>0 && !this.onGround))){
      if(this.onGround || this.coyote>0){ this.jumpsLeft = this.maxJumps; }
      if(this.jumpsLeft>0){
        this.vy = -620;
        this.jumpsLeft--;
        this.jumpBuffer = 0; this.coyote = 0;
        AudioMan.beep(720,0.08,'triangle',0.12, 'sfx', 900);
        for(let i=0;i<6;i++) Particles.emit({x:this.x+this.w/2+rand(-8,8), y:this.y+this.h, vx:rand(-40,40), vy:rand(10,60), life:0.4, size:2.5, color:'rgba(180,220,255,.8)'});
      }
    }
    // variable jump height
    if(!Input.jumpHeld() && this.vy<-220) this.vy = -220;

    // ---- Dash
    if(Input.wantsDash() && this.dashCd<=0){
      const dir = ax!==0 ? Math.sign(ax) : this.facing;
      this.dashT = 0.16; this.dashCd = GAME_CONFIG.dashCooldown;
      this.vx = dir*720; this.vy = 0;
      this.invuln = Math.max(this.invuln, 0.18);
      AudioMan.beep(500,0.1,'sawtooth',0.13,'sfx',900);
      for(let i=0;i<10;i++) Particles.emit({x:this.x+this.w/2, y:this.y+this.h/2, vx:rand(-120,120), vy:rand(-60,60), life:0.35, size:3, color:'#5ad1ff'});
    }
    if(this.dashT>0){
      this.dashT -= dt;
      this.vy = 0;
    }

    // ---- Attack (light)
    if(Input.wantsAttack() && this.attackCd<=0 && this.dashT<=0){
      this.comboIndex = (this.comboIndex % 3) + 1;
      this.comboTimer = 0.7;
      this.attackT = 0.22;
      this.attackCd = 0.28;
      this.hitTargets.clear();
      const dmgMul = 1 + (this.comboIndex-1)*0.25;
      this.comboDamage = dmgMul;
      AudioMan.slash();
      // slash particles
      const dirX = this.facing;
      for(let i=0;i<8;i++){
        Particles.emit({
          x:this.x + this.w/2 + dirX*22, y:this.y + this.h/2 + rand(-8,8),
          vx:dirX*rand(120,260), vy:rand(-40,40),
          life:0.25, size:3, color: SaveMan.state.cls==='arcanist'?'#b06bff':SaveMan.state.cls==='ranger'?'#7cffb0':'#ff8a5c'
        });
      }
    }
    if(this.attackT>0) this.attackT-=dt;

    // ---- Heavy
    if(Input.wantsHeavy() && this.heavyCd<=0 && this.dashT<=0){
      this.heavyT = 0.32; this.heavyCd = 1.1; this.hitTargets.clear();
      AudioMan.beep(280,0.15,'sawtooth',0.18,'sfx',100);
      for(let i=0;i<14;i++) Particles.emit({x:this.x+this.w/2 + this.facing*24, y:this.y+this.h/2, vx:this.facing*rand(100,300), vy:rand(-80,80), life:0.4, size:4, color:'#ff8a5c'});
    }
    if(this.heavyT>0) this.heavyT-=dt;

    // ---- Skills
    const skill1 = s.skills[0], skill2 = s.skills[1];
    if(Input.wantsS1() && skill1 && SKILLS[skill1] && (this.skillCd[skill1]||0)<=0) this.useSkill(skill1);
    if(Input.wantsS2() && skill2 && SKILLS[skill2] && (this.skillCd[skill2]||0)<=0) this.useSkill(skill2);
    if(Input.wantsUlti() && this.ultiReady) this.useUlti();

    // ---- Gravity
    if(this.dashT<=0){
      this.vy += GAME_CONFIG.baseGravity * dt;
      if(this.vy>1400) this.vy = 1400;
    }

    // ---- Physics collision
    this.moveAndCollide(dt);

    // ---- Animation
    this.animT += dt;

    // ---- Auto ulti charge
    if(!this.ultiReady){
      this.ultiCharge = Math.min(100, this.ultiCharge + 3.5*dt);
      if(this.ultiCharge>=100){ this.ultiReady=true; Toasts.show('Ultimate ready!','ok','star',1600); }
    }

    // ---- Interact (chest)
    if(Input.consume('interact') || Input.consumeTouch('interact')){
      const nearChest = World.chests.find(c=>!c.opened && Math.abs((this.x+this.w/2)-(c.x+c.w/2))<40 && Math.abs((this.y+this.h)-(c.y+c.h))<60);
      if(nearChest) openChest(nearChest);
    }
  },
  moveAndCollide(dt){
    // X
    this.x += this.vx*dt;
    for(const p of World.platforms){
      if(!aabb(this, p)) continue;
      if(this.vx>0) this.x = p.x - this.w;
      else if(this.vx<0) this.x = p.x + p.w;
      this.vx = 0;
    }
    // Y
    this.onGround = false;
    this.y += this.vy*dt;
    for(const p of World.platforms){
      if(!aabb(this, p)) continue;
      if(this.vy>0){
        this.y = p.y - this.h;
        if(!this.onGround && this.vy>380){
          for(let i=0;i<6;i++) Particles.emit({x:this.x+rand(0,this.w), y:this.y+this.h, vx:rand(-60,60), vy:rand(-80,-20), life:0.4, size:2.5, color:'rgba(180,200,230,.7)'});
        }
        this.vy = 0; this.onGround = true;
      } else if(this.vy<0){
        this.y = p.y + p.h; this.vy = 0;
      }
    }
    // world bounds
    if(this.x<0) this.x=0;
    if(this.x+this.w>World.width) this.x = World.width-this.w;
    // fall out
    if(this.y>World.groundY+200) { this.hurt(30, 'fall'); this.y = 100; this.vy = 0; }
  },
  useSkill(key){
    const s = SKILLS[key];
    this.skillCd[key] = s.cd;
    AudioMan.beep(660,0.15,'triangle',0.16,'sfx',1200);
    // shield/regen skills
    if(s.buff==='shield'){ this.buffed.shield = {type:'def', val:0.3, expires: performance.now()/1000 + s.dur}; Toasts.show('Barrier active','ok','shield2',1500); return; }
    if(s.buff==='regen'){ this.buffed.regen = {type:'hp', val:8, expires: performance.now()/1000 + s.dur}; Toasts.show('Regenerating','ok','heart',1500); return; }
    // damage skills: create aoe hit
    const st = this.stats();
    const dmg = Math.floor(st.atk * s.dmg * st.skillPower);
    const range = key==='whirl' ? 90 : key==='chain' ? 260 : 140;
    const cx = this.x + this.w/2 + this.facing * (key==='whirl'?0:60);
    const cy = this.y + this.h/2;
    let hitAny = false;
    for(const e of World.enemies){ if(e.dead) continue;
      if(Math.abs(e.x + e.w/2 - cx) < range && Math.abs(e.y + e.h/2 - cy) < 90){
        dealDamageToEnemy(e, dmg, this.facing, true); hitAny=true;
      }
    }
    if(World.boss && !World.boss.dead){
      if(Math.abs(World.boss.x + World.boss.w/2 - cx) < range + 40){
        dealDamageToBoss(World.boss, dmg, this.facing); hitAny=true;
      }
    }
    // visual
    for(let i=0;i<24;i++){
      Particles.emit({
        x:cx + rand(-30,30), y:cy + rand(-30,30),
        vx:rand(-200,200), vy:rand(-200,200),
        life:0.6, size:4, color: key==='chain'?'#8ce0ff':'#b06bff'
      });
    }
    Game.shake(6, 0.18);
  },
  useUlti(){
    this.ultiReady = false; this.ultiCharge = 0; this.ultiT = 0.6;
    AudioMan.boss();
    Game.shake(14, 0.55);
    Game.hitStop = 0.15;
    const st = this.stats();
    const dmg = Math.floor(st.atk * SKILLS.ult_rage.dmg * st.skillPower);
    // damage everything nearby
    for(const e of World.enemies){ if(e.dead) continue;
      if(Math.abs(e.x - this.x) < 380) dealDamageToEnemy(e, dmg, this.facing, true);
    }
    if(World.boss && !World.boss.dead && Math.abs(World.boss.x - this.x) < 500) dealDamageToBoss(World.boss, dmg, this.facing);
    // burst effect
    for(let i=0;i<80;i++){
      const a = Math.random()*Math.PI*2;
      const s = rand(200,700);
      Particles.emit({x:this.x+this.w/2, y:this.y+this.h/2, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1.0, size:5, color: i%2?'#ffcb5c':'#b06bff', grav:200});
    }
    Toasts.show('SHADOW UNLEASH!','ok','star',1800);
  },
  hurt(amount, src='enemy'){
    if(this.invuln>0 || this.dashT>0) return;
    const st = this.stats();
    const dmg = Math.max(1, Math.floor(amount * (100/(100+st.def*3))));
    this.hp -= dmg;
    this.invuln = 0.7;
    this.hurtFlash = 0.25;
    SaveMan.state.stats.damageTaken += dmg;
    Game.shake(7, 0.18);
    Game.hitStop = 0.06;
    if(SaveMan.settings.vibration && navigator.vibrate) navigator.vibrate(20);
    AudioMan.hit();
    if(this.hp<=0){ this.hp=0; Game.onPlayerDeath(); }
  },
  heal(amount){ this.hp = Math.min(this.hpMax, this.hp + amount); },
  addXP(amount){
    const s = SaveMan.state;
    s.xp += amount;
    while(s.xp >= GAME_CONFIG.xpForLevel(s.level) && s.level < GAME_CONFIG.levelCap){
      s.xp -= GAME_CONFIG.xpForLevel(s.level);
      s.level++;
      s.skillPoints++;
      this.hp = this.hpMax; this.en = this.enMax;
      AudioMan.levelup();
      Toasts.show('Level up! Level '+s.level, 'ok', 'star', 2400);
      Particles.burst(this.x+this.w/2, this.y+this.h/2, 30, {color:'#ffcb5c', smin:100, smax:400, grav:100});
      SaveMan.save(true);
    }
  },
  draw(ctx, cam){
    const sx = this.x - cam.x, sy = this.y - cam.y;
    const c = CLASSES[SaveMan.state.cls];
    const col = c.color;
    ctx.save();
    // dash trail
    if(this.dashT>0){
      ctx.globalAlpha = 0.5;
      for(let i=1;i<=3;i++){
        ctx.fillStyle = col;
        ctx.fillRect(sx - this.facing*i*14, sy, this.w, this.h);
      }
      ctx.globalAlpha = 1;
    }
    // shadow
    if(SaveMan.settings.shadows){
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.beginPath(); ctx.ellipse(sx+this.w/2, sy+this.h+2, this.w*0.7, 4, 0, 0, Math.PI*2); ctx.fill();
    }
    // body
    if(this.hurtFlash>0){ ctx.fillStyle='#ffffff'; }
    else { ctx.fillStyle = col; }
    if(SaveMan.settings.quality!=='performance'){
      ctx.shadowColor = col; ctx.shadowBlur = 12;
    }
    ctx.fillRect(sx, sy, this.w, this.h);
    ctx.shadowBlur = 0;
    // head
    ctx.fillStyle = '#eaf3ff';
    ctx.beginPath(); ctx.arc(sx+this.w/2, sy+6, 7, 0, Math.PI*2); ctx.fill();
    // facing indicator
    ctx.fillStyle = '#04121f';
    const eyeDir = this.facing>0 ? 3 : -3;
    ctx.beginPath(); ctx.arc(sx+this.w/2 + eyeDir, sy+6, 2, 0, Math.PI*2); ctx.fill();
    // attack arc
    if(this.attackT>0){
      ctx.strokeStyle = col; ctx.lineWidth = 3;
      ctx.shadowColor = col; ctx.shadowBlur = 12;
      const r = 28 + (0.22-this.attackT)*100;
      ctx.beginPath();
      const a0 = this.facing>0 ? -0.9 : Math.PI-0.9;
      const a1 = this.facing>0 ? 0.9 : Math.PI+0.9;
      ctx.arc(sx+this.w/2, sy+this.h/2, r, a0, a1, false);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    if(this.heavyT>0){
      ctx.strokeStyle = '#ff8a5c'; ctx.lineWidth = 5;
      ctx.shadowColor = '#ff8a5c'; ctx.shadowBlur = 14;
      const r = 40 + (0.32-this.heavyT)*80;
      ctx.beginPath();
      ctx.arc(sx+this.w/2, sy+this.h/2, r, 0, Math.PI*2);
      ctx.stroke(); ctx.shadowBlur = 0;
    }
    // ulti aura
    if(this.ultiT>0){
      ctx.strokeStyle = '#ffcb5c';
      ctx.lineWidth = 2;
      ctx.globalAlpha = this.ultiT/0.6;
      const r = 60 + (0.6-this.ultiT)*400;
      ctx.beginPath(); ctx.arc(sx+this.w/2, sy+this.h/2, r, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // shield indicator
    if(this.buffed.shield){
      ctx.strokeStyle = '#8ce0ff'; ctx.lineWidth = 2;
      ctx.globalAlpha = 0.7;
      ctx.beginPath(); ctx.arc(sx+this.w/2, sy+this.h/2, this.w*1.3, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
};

function aabb(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function rectsOverlap(x1,y1,w1,h1,x2,y2,w2,h2){
  return x1 < x2+w2 && x1+w1 > x2 && y1 < y2+h2 && y1+h1 > y2;
}

// ---------------------------------------------------------------
// COMBAT
// ---------------------------------------------------------------
function playerAttackBox(){
  const range = SaveMan.state.cls==='ranger' ? 42 : 40;
  const x = Player.facing>0 ? Player.x + Player.w - 4 : Player.x - range + 4;
  return { x, y: Player.y + 4, w: range, h: Player.h - 8 };
}
function playerHeavyBox(){
  const range = 58;
  const x = Player.facing>0 ? Player.x + Player.w - 6 : Player.x - range + 6;
  return { x, y: Player.y, w: range, h: Player.h };
}

function dealDamageToEnemy(e, dmg, facing, noCombo){
  const st = Player.stats();
  const isCrit = Math.random() < st.crit;
  const final = Math.floor(dmg * (isCrit ? st.critDmg : 1));
  const reduced = Math.max(1, Math.floor(final * (100/(100+e.defVal*4))));
  e.hp -= reduced;
  e.hurtT = 0.18;
  e.invuln = 0.05;
  if(!noCombo && e.hp>0){
    Game.combo++;
    Game.comboTimer = 2;
    if(Game.combo > SaveMan.state.stats.bestCombo) SaveMan.state.stats.bestCombo = Game.combo;
  }
  SaveMan.state.stats.damageDealt += reduced;
  Game.addDamageNumber(e.x + e.w/2, e.y, reduced, isCrit ? 'crit' : 'normal');
  Game.shake(4, 0.1);
  Game.hitStop = 0.05;
  AudioMan.hit();
  Particles.burst(e.x+e.w/2, e.y+e.h/2, 8, {color: isCrit?'#ffcb5c':'#5ad1ff', smin:60, smax:220, grav:400});
  if(e.hp<=0){
    e.dead = true;
    killEnemy(e);
  } else {
    // knockback
    e.vx += facing * 120;
    e.vy -= 40;
    if(e.state!=='attack' && e.state!=='stagger') e.state = 'stagger';
  }
}
function dealDamageToBoss(b, dmg, facing){
  const st = Player.stats();
  const isCrit = Math.random() < st.crit;
  const final = Math.floor(dmg * (isCrit ? st.critDmg : 1));
  const reduced = Math.max(1, Math.floor(final * (100/(100+b.defVal*4))));
  b.hp -= reduced;
  b.hurtT = 0.12;
  SaveMan.state.stats.damageDealt += reduced;
  Game.addDamageNumber(b.x + b.w/2, b.y + 10, reduced, isCrit?'crit':'normal');
  Game.shake(5, 0.12);
  Game.hitStop = 0.04;
  AudioMan.hit();
  Particles.burst(b.x+b.w/2, b.y+b.h/2, 12, {color:'#ff5566', smin:100, smax:280, grav:300});
  // phase check
  const hpPct = b.hp/b.hpMax;
  const cfg = BOSSES[b.key];
  for(let i=cfg.phases.length-1;i>=0;i--){
    if(hpPct <= cfg.phases[i].at && b.phase < i){
      b.phase = i;
      AudioMan.boss();
      Game.shake(16, 0.5);
      Toasts.show(b.name+' — Phase '+(b.phase+1), 'warn', 'warning', 2200);
      // burst
      for(let k=0;k<40;k++){
        const a = Math.random()*Math.PI*2, s = rand(200,500);
        Particles.emit({x:b.x+b.w/2, y:b.y+b.h/2, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0.9, size:5, color:'#ff2e6b'});
      }
      break;
    }
  }
  if(b.hp<=0){
    b.dead = true;
    onBossDefeated(b);
  }
}

function killEnemy(e){
  SaveMan.state.stats.kills++;
  if(e.elite) SaveMan.state.stats.elites++;
  Player.addXP(e.xp);
  SaveMan.state.credits += e.credit;
  Toasts.show('+'+e.xp+' XP  +'+e.credit+' Credits', 'ok', 'coin', 1400);
  AudioMan.pickup();
  // drops
  const dropRoll = Math.random();
  if(dropRoll < 0.35){
    addItem('mat_shard', 1);
  } else if(dropRoll < 0.5){
    addItem('hp_potion', 1);
  } else if(dropRoll < 0.6){
    addItem('en_potion', 1);
  }
  Particles.burst(e.x+e.w/2, e.y+e.h/2, 16, {color:e.def.color, smin:120, smax:280, grav:300});
  // combo xp bonus
  if(Game.combo>0){ Player.addXP(Math.floor(e.xp * 0.15 * Game.combo)); }
}

function onBossDefeated(b){
  SaveMan.state.bossDefeated[b.key] = true;
  SaveMan.state.stats.bosses++;
  Player.addXP(b.xp);
  SaveMan.state.credits += b.credit;
  SaveMan.state.shards += 5 + Math.floor(Math.random()*10);
  AudioMan.levelup();
  Game.shake(20, 0.8);
  Toasts.show(b.name+' defeated!', 'ok', 'crown', 3000);
  // loot
  addItem('mat_core', 2);
  addItem('mat_rune', 3);
  if(b.key==='guardian') addItem('w_shadow_blade', 1);
  if(b.key==='warden') addItem('a_guardian', 1);
  if(b.key==='voidknight') addItem('a_crystal', 1);
  if(b.key==='abyssqueen') addItem('acc_pendant', 1);
  if(b.key==='core') { addItem('w_void_reaper', 1); addItem('a_shadow', 1); }
  Game.bossKilled = true;
  setTimeout(()=>{ Game.nextRegion(); }, 2200);
  SaveMan.save();
}

// ---------------------------------------------------------------
// INVENTORY HELPERS
// ---------------------------------------------------------------
function addItem(id, qty=1){
  if(!ITEMS[id]) return;
  const s = SaveMan.state;
  const stackable = ITEMS[id].stack > 1;
  const existing = stackable ? s.inventory.find(i=>i.id===id) : null;
  if(existing){ existing.qty = clamp(existing.qty + qty, 1, 9999); }
  else { s.inventory.push({id, qty, uid: uid()}); }
  s.stats.itemsCollected += qty;
  Toasts.show('+'+qty+' '+ITEMS[id].name, 'ok', ITEMS[id].icon, 1400);
  AudioMan.pickup();
  SaveMan.save(true);
  checkAchievements();
}
function removeItem(uidE, qty=1){
  const s = SaveMan.state;
  const idx = s.inventory.findIndex(i=>i.uid===uidE);
  if(idx<0) return;
  s.inventory[idx].qty -= qty;
  if(s.inventory[idx].qty<=0) s.inventory.splice(idx,1);
  SaveMan.save(true);
}

function checkAchievements(){
  const s = SaveMan.state;
  for(const a of ACHIEVEMENTS){
    if(s.achievements.includes(a.id)) continue;
    try{
      if(a.check(s)){
        s.achievements.push(a.id);
        Toasts.show('Achievement: '+a.name, 'ok', 'trophy', 2600);
        s.credits += 50;
        Player.addXP(30);
        AudioMan.pickup();
      }
    }catch(e){}
  }
}
