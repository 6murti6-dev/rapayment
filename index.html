function openChest(c){
  c.opened = true;
  const roll = Math.random();
  let lootId = 'mat_shard';
  if(roll<0.35) lootId = 'mat_shard';
  else if(roll<0.55) lootId = 'mat_rune';
  else if(roll<0.72) lootId = 'hp_potion';
  else if(roll<0.85) lootId = 'en_potion';
  else if(roll<0.94) lootId = 'acc_ring';
  else lootId = 'mat_core';
  const qty = 1 + Math.floor(Math.random()*3);
  addItem(lootId, qty);
  if(Math.random()<0.3){ const c2 = randInt(20,60); SaveMan.state.credits += c2; Toasts.show('+'+c2+' Credits', 'ok', 'coin', 1500); }
  for(let i=0;i<20;i++) Particles.emit({x:c.x+c.w/2, y:c.y, vx:rand(-80,80), vy:rand(-200,-40), life:0.9, size:3, color:'#ffcb5c'});
}

// ---------------------------------------------------------------
// ENEMY AI UPDATE
// ---------------------------------------------------------------
function updateEnemy(e, dt){
  if(e.dead) return;
  if(e.hurtT>0) e.hurtT-=dt;
  if(e.invuln>0) e.invuln-=dt;
  if(e.staggerT>0){ e.staggerT-=dt; e.state = 'stagger'; }
  e.animT += dt;
  e.attackCd = Math.max(0, e.attackCd - dt);
  e.jumpCd = Math.max(0, e.jumpCd - dt);

  const px = Player.x + Player.w/2, py = Player.y + Player.h/2;
  const ex = e.x + e.w/2, ey = e.y + e.h/2;
  const dx = px - ex, dy = py - ey;
  const dist = Math.hypot(dx, dy);

  // gravity
  e.vy += GAME_CONFIG.baseGravity * dt;

  if(e.state!=='stagger' && e.state!=='dead'){
    if(dist < 60 && Math.abs(dy) < 60){ e.state = 'detect'; }
    if(dist < e.def.range + 20 && Math.abs(dy) < 60 && e.attackCd<=0){
      e.state = 'attack';
      e.attackCd = 1.2 + Math.random()*0.5;
      e.stateTime = 0;
    }
    // AI behaviors
    const ai = e.def.ai;
    let mvx = 0;
    if(ai==='chaser'){
      if(dist < 340) mvx = Math.sign(dx) * e.spd;
      else mvx = e.patrolDir * e.spd * 0.5;
      if(Math.sign(dx)!==0) e.facing = Math.sign(dx);
    } else if(ai==='erratic'){
      if(dist < 320){
        mvx = Math.sign(dx)*e.spd;
        if(e.jumpCd<=0 && Math.random()<0.02){ e.vy = -480; e.jumpCd = 1.5; }
        if(Math.random()<0.02) e.vx += rand(-120,120);
      } else { mvx = e.patrolDir * e.spd * 0.6; }
      e.facing = Math.sign(dx) || e.facing;
    } else if(ai==='ranged'){
      if(dist > e.def.range) mvx = Math.sign(dx) * e.spd;
      else if(dist < 100) mvx = -Math.sign(dx) * e.spd;
      e.facing = Math.sign(dx) || e.facing;
      // shoot
      e.bulletCd = (e.bulletCd||0) - dt;
      if(dist < e.def.range && e.bulletCd<=0 && Math.abs(dy)<120){
        e.bulletCd = 1.8 + Math.random()*0.6;
        const bulletVx = Math.sign(dx) * 300;
        Game.projectiles.push({
          x: ex, y: ey, vx: bulletVx, vy: dy/dist*40, life: 2.5, dmg: e.atk, friendly:false,
          color: e.def.color, r: 5,
        });
        AudioMan.beep(300,0.1,'square',0.1,'sfx',200);
      }
    } else if(ai==='tank'){
      if(dist < 260) mvx = Math.sign(dx) * e.spd;
      else mvx = e.patrolDir * e.spd * 0.4;
      e.facing = Math.sign(dx) || e.facing;
    }
    if(e.state === 'attack'){
      // attack pause
      mvx = 0;
      e.stateTime += dt;
      if(e.stateTime > 0.35 && e.stateTime < 0.5 && !e.attackDone){
        // damage check
        if(Math.abs(px-ex) < e.def.range + 30 && Math.abs(py-ey) < 40){
          Player.hurt(e.atk * GAME_CONFIG.difficulty[SaveMan.settings.difficulty], 'enemy');
        }
        e.attackDone = true;
        Particles.burst(e.facing>0?e.x+e.w+10:e.x-10, ey, 8, {color:e.def.color, smin:80, smax:200});
      }
      if(e.stateTime > 0.8){ e.state='chase'; e.attackDone=false; }
    } else {
      e.vx = mvx;
    }
  } else {
    e.vx *= 0.9;
  }

  // physics
  e.x += e.vx * dt;
  e.onGround = false;
  e.y += e.vy * dt;
  for(const p of World.platforms){
    if(!aabb(e, p)) continue;
    if(e.vy>0){ e.y = p.y - e.h; e.vy=0; e.onGround=true; }
    else if(e.vy<0){ e.y = p.y + p.h; e.vy=0; }
  }
  // horizontal collision
  for(const p of World.platforms){
    if(!aabb(e, p)) continue;
    if(e.vx>0){ e.x = p.x - e.w; } else if(e.vx<0){ e.x = p.x + p.w; }
  }
  if(e.y>World.groundY+300){ e.dead = true; }
  if(e.x<-100 || e.x>World.width+100){ e.patrolDir *= -1; e.x = clamp(e.x, 0, World.width-e.w); }
}

function drawEnemy(e, ctx, cam){
  const sx = e.x - cam.x, sy = e.y - cam.y;
  if(sx+e.w<-40||sx>cam.w+40) return;
  const t = e.animT;
  ctx.save();
  // shadow
  if(SaveMan.settings.shadows){
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.beginPath(); ctx.ellipse(sx+e.w/2, sy+e.h+3, e.w*0.7, 4, 0, 0, Math.PI*2); ctx.fill();
  }
  // elite aura
  if(e.elite){
    const pulse = 0.5 + Math.sin(t*4)*0.2;
    ctx.strokeStyle = 'rgba(255,203,92,'+pulse+')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx+e.w/2, sy+e.h/2, e.w*0.9 + Math.sin(t*3)*3, 0, Math.PI*2); ctx.stroke();
  }
  ctx.fillStyle = e.hurtT>0 ? '#ffffff' : e.def.color;
  if(SaveMan.settings.quality!=='performance'){ ctx.shadowColor = e.def.color; ctx.shadowBlur = 10; }
  // body shape by type
  if(e.type==='slime'){
    const squish = Math.sin(t*4)*0.15;
    ctx.beginPath();
    ctx.ellipse(sx+e.w/2, sy+e.h*(0.7+squish*0.1), e.w/2, e.h/2*(1-squish*0.3), 0, 0, Math.PI*2);
    ctx.fill();
  } else if(e.type==='wolf' || e.type==='phantom' || e.type==='hunter'){
    ctx.beginPath();
    ctx.moveTo(sx, sy+e.h);
    ctx.lineTo(sx+e.w*0.5, sy);
    ctx.lineTo(sx+e.w, sy+e.h);
    ctx.closePath(); ctx.fill();
  } else if(e.type==='archer' || e.type==='mage' || e.type==='knight' || e.type==='guard'){
    ctx.fillRect(sx, sy, e.w, e.h);
    // head
    ctx.fillStyle = '#04121f';
    ctx.beginPath(); ctx.arc(sx+e.w/2, sy+e.h*0.25, 4, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.fillRect(sx, sy, e.w, e.h);
  }
  ctx.shadowBlur=0;
  // HP bar if damaged
  if(e.hp < e.hpMax){
    const bw = e.w + 4;
    ctx.fillStyle = 'rgba(0,0,0,.7)';
    ctx.fillRect(sx-2, sy-8, bw, 4);
    ctx.fillStyle = e.elite ? '#ffcb5c' : '#ff4d6d';
    ctx.fillRect(sx-2, sy-8, bw * (e.hp/e.hpMax), 4);
  }
  ctx.restore();
}

// ---------------------------------------------------------------
// BOSS AI
// ---------------------------------------------------------------
function updateBoss(b, dt){
  if(b.dead) return;
  b.animT += dt;
  if(b.hurtT>0) b.hurtT-=dt;
  if(b.attackCd>0) b.attackCd-=dt;
  if(b.telegraph>0){
    b.telegraph -= dt;
    if(b.telegraph<=0){
      // execute
      if(b.telegraphType==='slam'){
        Game.shake(16, 0.4);
        const bx = b.x + b.w/2;
        if(Math.abs(Player.x + Player.w/2 - bx) < 140 && Player.y + Player.h > World.groundY - 40){
          Player.hurt(b.atk * GAME_CONFIG.difficulty[SaveMan.settings.difficulty]);
        }
        for(let i=0;i<30;i++) Particles.emit({x:bx + rand(-140,140), y:World.groundY, vx:rand(-100,100), vy:rand(-200,-50), life:0.7, size:4, color:b.def.color});
      } else if(b.telegraphType==='dash'){
        const dir = Math.sign(Player.x - b.x) || -1;
        b.vx = dir * 500; b.dashT = 0.5;
      } else if(b.telegraphType==='summon'){
        for(let i=0;i<2;i++){
          const t = b.key==='core'?'rift': b.key==='abyssqueen'?'hunter': b.key==='voidknight'?'knight':'phantom';
          const e = spawnEnemy(t, b.x + rand(-100,100), b.y - 20);
          World.enemies.push(e);
        }
      } else if(b.telegraphType==='ring'){
        // radial bullets
        const bx = b.x + b.w/2, by = b.y + b.h/2;
        for(let i=0;i<12;i++){
          const a = (i/12)*Math.PI*2 + b.animT;
          Game.projectiles.push({x:bx, y:by, vx:Math.cos(a)*240, vy:Math.sin(a)*240, life:3, dmg:b.atk*0.7, friendly:false, color:b.def.color, r:7});
        }
      }
    }
  }
  if(b.dashT>0){ b.dashT-=dt; }
  else if(b.telegraph<=0){
    const px = Player.x + Player.w/2;
    const bx = b.x + b.w/2;
    const dx = px - bx;
    b.facing = Math.sign(dx) || b.facing;
    // move toward player
    const spd = 100 * BOSSES[b.key].phases[b.phase].speed;
    if(Math.abs(dx) > 80) b.vx = b.facing * spd;
    else b.vx = 0;
    // decide action
    if(b.attackCd<=0){
      const r = Math.random();
      if(r < 0.35) { b.telegraphType='slam'; b.telegraph=0.55; b.attackCd = 1.6; }
      else if(r < 0.6) { b.telegraphType='dash'; b.telegraph=0.4; b.attackCd = 1.8; }
      else if(r < 0.8) { b.telegraphType='summon'; b.telegraph=0.6; b.attackCd = 3.2; }
      else { b.telegraphType='ring'; b.telegraph=0.6; b.attackCd = 2.4; }
      b.telegraphT = 0;
    }
  }
  // physics
  b.vy += GAME_CONFIG.baseGravity * dt;
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  b.onGround = false;
  for(const p of World.platforms){
    if(!aabb(b, p)) continue;
    if(b.vy>0){ b.y = p.y - b.h; b.vy=0; b.onGround=true; }
    else if(b.vy<0){ b.y = p.y + p.h; b.vy=0; }
  }
  for(const p of World.platforms){
    if(!aabb(b, p)) continue;
    if(b.vx>0) b.x = p.x - b.w;
    else if(b.vx<0) b.x = p.x + p.w;
    b.vx = 0;
  }
  b.x = clamp(b.x, 40, World.width - b.w - 40);
  if(b.dashT>0) b.vx *= 0.96; else b.vx *= 0.85;
  if(b.telegraph>0){ /* frozen */ }

  // contact damage
  if(aabb(Player, b) && Player.invuln<=0){
    Player.hurt(b.atk * GAME_CONFIG.difficulty[SaveMan.settings.difficulty]);
  }
}
function drawBoss(b, ctx, cam){
  const sx = b.x - cam.x, sy = b.y - cam.y;
  ctx.save();
  if(SaveMan.settings.shadows){ ctx.fillStyle='rgba(0,0,0,.45)'; ctx.beginPath(); ctx.ellipse(sx+b.w/2, sy+b.h+4, b.w*0.8, 6, 0, 0, Math.PI*2); ctx.fill(); }
  // telegraph ring
  if(b.telegraph>0){
    const p = 1 - b.telegraph / 0.6;
    ctx.strokeStyle = 'rgba(255,77,109,'+(0.6+p*0.4)+')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(sx+b.w/2, sy+b.h/2, b.w*0.8 + p*60, 0, Math.PI*2); ctx.stroke();
  }
  ctx.fillStyle = b.hurtT>0?'#ffffff':b.def.color;
  if(SaveMan.settings.quality!=='performance'){ ctx.shadowColor = b.def.color; ctx.shadowBlur = 20; }
  // body
  ctx.fillRect(sx, sy, b.w, b.h);
  ctx.shadowBlur = 0;
  // eyes
  ctx.fillStyle = '#ffffff';
  const eye = 6;
  ctx.beginPath(); ctx.arc(sx+b.w*0.35, sy+b.h*0.3, eye, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx+b.w*0.65, sy+b.h*0.3, eye, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#04121f';
  ctx.beginPath(); ctx.arc(sx+b.w*0.35 + b.facing*3, sy+b.h*0.3, eye*0.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx+b.w*0.65 + b.facing*3, sy+b.h*0.3, eye*0.5, 0, Math.PI*2); ctx.fill();
  // phase crown indicator
  ctx.strokeStyle = '#ffcb5c'; ctx.lineWidth = 2;
  for(let i=0;i<=b.phase;i++){
    ctx.beginPath(); ctx.arc(sx+b.w/2 + (i - b.phase/2)*12, sy-14, 3, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

// ---------------------------------------------------------------
// PROJECTILES
// ---------------------------------------------------------------
function updateProjectiles(dt){
  for(let i=Game.projectiles.length-1;i>=0;i--){
    const p = Game.projectiles[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.life -= dt;
    let hit = false;
    if(!p.friendly){
      if(aabb({x:p.x-p.r, y:p.y-p.r, w:p.r*2, h:p.r*2}, Player)){
        Player.hurt(p.dmg); hit = true;
      }
    } else {
      for(const e of World.enemies){ if(e.dead) continue; if(rectsOverlap(p.x-p.r,p.y-p.r,p.r*2,p.r*2,e.x,e.y,e.w,e.h)){ dealDamageToEnemy(e, p.dmg, 1, true); hit=true; break; } }
      if(World.boss && !World.boss.dead && rectsOverlap(p.x-p.r,p.y-p.r,p.r*2,p.r*2,World.boss.x,World.boss.y,World.boss.w,World.boss.h)){ dealDamageToBoss(World.boss, p.dmg, 1); hit=true; }
    }
    // world collision
    for(const pl of World.platforms){ if(rectsOverlap(p.x-p.r,p.y-p.r,p.r*2,p.r*2, pl.x, pl.y, pl.w, pl.h)){ hit=true; break; } }
    if(hit || p.life<=0){
      Particles.burst(p.x, p.y, 6, {color:p.color, smin:60, smax:180});
      Game.projectiles.splice(i,1);
    }
  }
}
function drawProjectiles(ctx, cam){
  for(const p of Game.projectiles){
    const sx = p.x - cam.x, sy = p.y - cam.y;
    ctx.save();
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(sx, sy, p.r, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

// ---------------------------------------------------------------
// GAME
// ---------------------------------------------------------------
const Game = {
  canvas:null, ctx:null, dpr:1, w:0, h:0,
  cam: { x:0, y:0, w:0, h:0, shakeX:0, shakeY:0, shakeT:0, shakeAmp:0 },
  state:'menu', // menu, playing, paused, dead, transition
  lastT:0, acc:0,
  hitStop:0, combo:0, comboTimer:0,
  damageNumbers: [],
  projectiles: [],
  bossKilled:false,
  regionTransition:0,
  debug:false,
  fps:0, frameCount:0, fpsTime:0,

  init(){
    this.canvas = $('#game');
    this.ctx = this.canvas.getContext('2d', { alpha:false });
    this.resize();
    window.addEventListener('resize', ()=>this.resize());
    Particles.init();
    Input.init();
    this.lastT = performance.now();
    requestAnimationFrame(t=>this.loop(t));
  },
  resize(){
    const w = window.innerWidth, h = window.innerHeight;
    this.dpr = Math.min(window.devicePixelRatio||1, 2);
    this.canvas.width = Math.floor(w*this.dpr);
    this.canvas.height = Math.floor(h*this.dpr);
    this.canvas.style.width = w+'px';
    this.canvas.style.height = h+'px';
    this.w = w; this.h = h;
    this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    this.cam.w = w; this.cam.h = h;
  },
  loop(t){
    const dt = Math.min(0.05, (t - this.lastT)/1000);
    this.lastT = t;
    // FPS
    this.frameCount++;
    if(t - this.fpsTime > 500){ this.fps = this.frameCount/((t-this.fpsTime)/1000); this.frameCount = 0; this.fpsTime = t; }
    if(this.hitStop>0){ this.hitStop -= dt; }
    else if(this.state==='playing'){ this.update(dt); }
    this.render();
    Input.endFrame();
    requestAnimationFrame(tt=>this.loop(tt));
  },
  update(dt){
    const s = SaveMan.state;
    s.stats.playtime += dt;
    // Player
    Player.update(dt);
    // Enemies
    for(const e of World.enemies) updateEnemy(e, dt);
    // Remove dead
    for(let i=World.enemies.length-1;i>=0;i--){ if(World.enemies[i].dead) World.enemies.splice(i,1); }
    // Boss
    if(World.boss && !World.boss.dead){
      if(!World.boss.active && Math.abs(Player.x - World.boss.x) < 480){
        World.boss.active = true;
        World.boss.phase = 0;
        AudioMan.playTrack('boss');
        Toasts.show('BOSS: '+World.boss.name, 'warn', 'warning', 2600);
      }
      if(World.boss.active) updateBoss(World.boss, dt);
      // HUD
      $('#bossbar').classList.add('on');
      $('#boss-name').textContent = World.boss.name;
      $('#boss-hp').style.width = (World.boss.hp/World.boss.hpMax*100)+'%';
      const phases = $('#boss-phases'); phases.innerHTML='';
      for(let i=0;i<BOSSES[World.boss.key].phases.length;i++){
        const sp = el('span', i<=World.boss.phase?'on':''); phases.appendChild(sp);
      }
    } else { $('#bossbar').classList.remove('on'); }

    // projectiles
    updateProjectiles(dt);

    // particles
    Particles.update(dt);

    // camera
    const targetX = Player.x + Player.w/2 - this.w/2;
    const targetY = Player.y + Player.h/2 - this.h/2 - 20;
    this.cam.x = lerp(this.cam.x, targetX, 1 - Math.pow(0.0008, dt));
    this.cam.y = lerp(this.cam.y, targetY, 1 - Math.pow(0.0008, dt));
    this.cam.x = clamp(this.cam.x, 0, Math.max(0, World.width - this.w));
    this.cam.y = clamp(this.cam.y, -200, Math.max(0, World.groundY - this.h + 220));

    // shake
    if(this.cam.shakeT>0){
      this.cam.shakeT -= dt;
      const a = this.cam.shakeAmp * (this.cam.shakeT / this.cam._shakeDur);
      this.cam.shakeX = rand(-a, a);
      this.cam.shakeY = rand(-a, a);
    } else { this.cam.shakeX = 0; this.cam.shakeY = 0; }

    // combo
    if(this.comboTimer>0){ this.comboTimer -= dt; if(this.comboTimer<=0) this.combo = 0; }

    // damage numbers
    for(let i=this.damageNumbers.length-1;i>=0;i--){
      const d = this.damageNumbers[i];
      d.life -= dt; d.y -= 30*dt;
      if(d.life<=0) this.damageNumbers.splice(i,1);
    }

    // checkpoint activation
    for(const cp of World.checkpoints){
      if(!cp.active && Math.abs(Player.x + Player.w/2 - cp.x) < 30 && Math.abs(Player.y + Player.h - cp.y - cp.h) < 40){
        cp.active = true;
        SaveMan.state.checkpoint = {x: Player.x, y: Player.y, region: World.regionIndex};
        SaveMan.save();
        Toasts.show('Checkpoint activated', 'ok', 'check', 1600);
        Player.heal(Player.hpMax);
        for(let i=0;i<25;i++) Particles.emit({x:cp.x, y:cp.y, vx:rand(-100,100), vy:rand(-200,-50), life:0.9, size:3, color:'#7cffb0'});
      }
    }

    // region exit
    if(Player.x > World.width - 60 && World.regionIndex < REGIONS.length-1 && (SaveMan.state.bossDefeated[REGIONS[World.regionIndex].boss] || !REGIONS[World.regionIndex].boss)){
      this.nextRegion();
    }

    // autosave
    if(SaveMan.settings.autoSave){
      this._saveT = (this._saveT||0) + dt;
      if(this._saveT > 20){ this._saveT = 0; SaveMan.save(true); }
    }

    // HUD update
    this.updateHUD();
    // achievements check periodically
    this._achT = (this._achT||0) + dt;
    if(this._achT > 3){ this._achT = 0; checkAchievements(); }
  },
  updateHUD(){
    const s = SaveMan.state;
    $('#hud-lv').textContent = s.level;
    $('#hud-hp').style.width = clamp(Player.hp/Player.hpMax*100,0,100)+'%';
    $('#hud-en').style.width = clamp(Player.en/Player.enMax*100,0,100)+'%';
    const xpNeed = GAME_CONFIG.xpForLevel(s.level);
    $('#hud-xp').style.width = clamp(s.xp/xpNeed*100,0,100)+'%';
    $('#hud-cr').textContent = fmt(s.credits);
    $('#hud-sh').textContent = fmt(s.shards);
    // quest
    const activeQuest = Object.keys(s.quests).map(id=>QUESTS.find(q=>q.id===id)).filter(q=>q)[0];
    if(activeQuest){
      const q = s.quests[activeQuest.id];
      $('#hud-quest').innerHTML = `<div class="qn">${activeQuest.cat.toUpperCase()}</div><div class="qt">${activeQuest.name}</div><div class="qp">${q.progress||0} / ${activeQuest.goal||'—'}</div>`;
    } else { $('#hud-quest').innerHTML = '<div class="qn">Quests</div><div class="qt">None active</div>'; }
    // ulti button ready
    $('#t-ulti').classList.toggle('ready', Player.ultiReady);
  },
  render(){
    const ctx = this.ctx;
    ctx.save();
    if(this.state==='menu' || this.state==='transition'){
      // animate menu background particles even without gameplay
      ctx.fillStyle = '#05070f';
      ctx.fillRect(0,0,this.w,this.h);
    } else {
      ctx.translate(this.cam.shakeX, this.cam.shakeY);
      World.draw(ctx, {x:this.cam.x, y:this.cam.y, w:this.w, h:this.h});
      // enemies
      for(const e of World.enemies) drawEnemy(e, ctx, {x:this.cam.x, y:this.cam.y, w:this.w, h:this.h});
      // boss
      if(World.boss && !World.boss.dead) drawBoss(World.boss, ctx, {x:this.cam.x, y:this.cam.y, w:this.w, h:this.h});
      // projectiles
      drawProjectiles(ctx, {x:this.cam.x, y:this.cam.y, w:this.w, h:this.h});
      // particles
      Particles.draw(ctx, {x:this.cam.x, y:this.cam.y, w:this.w, h:this.h});
      // player
      Player.draw(ctx, {x:this.cam.x, y:this.cam.y, w:this.w, h:this.h});
      // damage numbers
      for(const d of this.damageNumbers){
        const sx = d.x - this.cam.x, sy = d.y - this.cam.y;
        ctx.save();
        ctx.globalAlpha = clamp(d.life/1.0, 0, 1);
        ctx.font = `bold ${d.crit?18:14}px system-ui`;
        ctx.textAlign = 'center';
        ctx.fillStyle = d.crit ? '#ffcb5c' : (d.kind==='heal' ? '#7cffb0' : '#ffffff');
        ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.lineWidth = 3;
        ctx.strokeText(d.val, sx, sy);
        ctx.fillText(d.val, sx, sy);
        ctx.restore();
      }
      // combo counter
      if(this.combo>1){
        ctx.save();
        ctx.font = 'bold 22px system-ui';
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffcb5c';
        ctx.shadowColor = '#ffcb5c'; ctx.shadowBlur = 12;
        ctx.fillText(this.combo+'x', this.w-30, 130);
        ctx.font = '11px system-ui';
        ctx.fillText('COMBO', this.w-30, 148);
        ctx.restore();
      }
      // debug
      if(this.debug){
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,.6)';
        ctx.fillRect(10, this.h-140, 220, 130);
        ctx.fillStyle = '#7cffb0';
        ctx.font = '11px monospace';
        const lines = [
          'FPS: '+this.fps.toFixed(1),
          'Player: '+Math.floor(Player.x)+','+Math.floor(Player.y),
          'Vel: '+Math.floor(Player.vx)+','+Math.floor(Player.vy),
          'HP: '+Math.floor(Player.hp)+'/'+Player.hpMax,
          'Region: '+World.region.name,
          'Enemies: '+World.enemies.length,
          'Particles: '+Particles.active.length,
          'Firebase: '+(FirebaseMan.ready?'ok':'off'),
          'Save: '+(SaveMan.isGuest?'guest':'cloud'),
        ];
        lines.forEach((l,i)=>ctx.fillText(l, 18, this.h-120 + i*13));
        ctx.restore();
      }
    }
    ctx.restore();
  },
  addDamageNumber(x, y, val, kind){
    if(!SaveMan.settings.damageNumbers) return;
    this.damageNumbers.push({x, y, val, life:1.0, crit: kind==='crit'});
  },
  shake(amp, dur){
    if(!SaveMan.settings.screenShake) return;
    this.cam.shakeAmp = Math.max(this.cam.shakeAmp, amp);
    this.cam.shakeT = Math.max(this.cam.shakeT, dur);
    this.cam._shakeDur = Math.max(this.cam._shakeDur||0, dur);
  },
  startNewGame(cfg){
    SaveMan.state = SaveMan.newGame();
    SaveMan.state.name = cfg.name;
    SaveMan.state.cls = cfg.cls;
    Player.hpMax = CLASSES[cfg.cls].hp;
    Player.hp = Player.hpMax;
    Player.enMax = CLASSES[cfg.cls].energy;
    Player.en = Player.enMax;
    // starting gear
    addItem(CLASSES[cfg.cls].startWeapon, 1);
    addItem('hp_potion', 3);
    addItem('en_potion', 2);
    addItem('a_leather', 1);
    // equip start
    const wUid = SaveMan.state.inventory.find(i=>i.id===CLASSES[cfg.cls].startWeapon)?.uid;
    const aUid = SaveMan.state.inventory.find(i=>i.id==='a_leather')?.uid;
    SaveMan.state.equipped.weapon = wUid;
    SaveMan.state.equipped.armor = aUid;
    // start quests
    activateQuest('q_main_1');
    activateQuest('q_side_1');
    activateQuest('q_side_2');
    if(SaveMan.state.daily.last !== today()){
      activateQuest('q_daily_1');
      activateQuest('q_daily_2');
    }
    // Load region 0
    World.load(0);
    Player.init(SaveMan.state);
    this.state = 'playing';
    AudioMan.playTrack('village');
  },
  continueGame(){
    if(!SaveMan.state) return;
    World.load(SaveMan.state.region || 0);
    Player.init(SaveMan.state);
    Player.hpMax = Player.stats().hpMax; // recompute
    Player.hp = Math.min(SaveMan.state.hp || Player.hpMax, Player.hpMax);
    this.state = 'playing';
    AudioMan.playTrack(World.region.id);
  },
  togglePause(){
    if(this.state==='playing'){ this.state='paused'; UI.showPause(); AudioMan.stopMusic(); }
    else if(this.state==='paused'){ this.state='playing'; UI.hidePause(); AudioMan.playTrack(World.region?.id||'menu'); }
  },
  onPlayerDeath(){
    SaveMan.state.stats.deaths++;
    this.state='dead';
    AudioMan.die();
    AudioMan.stopMusic();
    setTimeout(()=>UI.showDeath(), 600);
  },
  respawn(){
    const cp = SaveMan.state.checkpoint;
    Player.hp = Player.hpMax; Player.en = Player.enMax;
    Player.x = cp.x; Player.y = cp.y; Player.vx = 0; Player.vy = 0;
    // reset enemies if region changed
    if(cp.region !== World.regionIndex) World.load(cp.region);
    else {
      // respawn enemies in current region
      const r = REGIONS[World.regionIndex];
      World.enemies = r.enemies.map(e => spawnEnemy(e.t, e.x, e.y));
      if(World.boss) { World.boss.hp = World.boss.hpMax; World.boss.active = false; World.boss.phase = 0; World.boss.x = r.bossX; }
    }
    this.state='playing';
    UI.hideDeath();
    AudioMan.playTrack(World.region.id);
  },
  nextRegion(){
    const next = World.regionIndex + 1;
    if(next >= REGIONS.length){
      // game complete
      UI.showVictory();
      return;
    }
    if(!SaveMan.state.unlockedRegions.includes(next)) SaveMan.state.unlockedRegions.push(next);
    SaveMan.state.stats.regions = Math.max(SaveMan.state.stats.regions, next+1);
    SaveMan.state.region = next;
    World.load(next);
    Player.x = 60; Player.y = World.groundY - 60;
    Player.hp = Math.min(Player.hpMax, Player.hp + Player.hpMax*0.5);
    SaveMan.save();
    Toasts.show('Entering '+REGIONS[next].name, 'ok', 'map', 2400);
    AudioMan.playTrack(REGIONS[next].id);
    checkAchievements();
    this.bossKilled = false;
  }
};

// ---------------------------------------------------------------
// QUEST SYSTEM
// ---------------------------------------------------------------
function today(){
  const d = new Date();
  return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
}
function activateQuest(id){
  if(!QUESTS.find(q=>q.id===id)) return;
  if(SaveMan.state.quests[id]) return;
  SaveMan.state.quests[id] = {progress:0, started: Date.now()};
}
function questProgress(type, data){
  const s = SaveMan.state;
  for(const id in s.quests){
    const q = QUESTS.find(x=>x.id===id);
    if(!q) continue;
    if(q.type !== type) continue;
    if(type==='kill'){ s.quests[id].progress = Math.min(q.goal, (s.quests[id].progress||0)+1); }
    if(type==='elite' && data?.elite){ s.quests[id].progress = Math.min(q.goal, (s.quests[id].progress||0)+1); }
    if(type==='item' && data?.itemId === q.item){ s.quests[id].progress = Math.min(q.goal, (s.quests[id].progress||0)+ (data.qty||1)); }
    if(type==='boss' && data?.boss === q.boss){ s.quests[id].progress = 1; }
    if(s.quests[id].progress >= q.goal){
      completeQuest(id);
    }
  }
}
function completeQuest(id){
  const q = QUESTS.find(x=>x.id===id);
  if(!q) return;
  SaveMan.state.stats.questsDone++;
  SaveMan.state.credits += q.reward.cr || 0;
  Player.addXP(q.reward.xp || 0);
  Toasts.show('Quest complete: '+q.name, 'ok', 'check', 2600);
  AudioMan.levelup();
  delete SaveMan.state.quests[id];
  // unlock next main
  const idx = QUESTS.findIndex(x=>x.id===id);
  if(q.cat==='main'){
    const nextMain = QUESTS[idx+1];
    if(nextMain && nextMain.cat==='main') activateQuest(nextMain.id);
  }
  checkAchievements();
  SaveMan.save();
}

  showAuthPanel(){
    UI.show('panel-host');
    const p = $('#panel');
    p.innerHTML = `
      <div class="panel-head">${iconSvg('user','')}<h2>Account</h2></div>
      <div class="tabs" id="auth-tabs">
        <button class="tab on" data-tab="login">Login</button>
        <button class="tab" data-tab="register">Register</button>
      </div>
      <div class="panel-body" id="auth-body"></div>
      <div class="panel-foot">
        <button class="btn ghost" id="auth-close">${iconSvg('close','')} Close</button>
        <button class="btn primary full" id="auth-submit">Login</button>
      </div>
    `;
    let mode = 'login';
    const render = ()=>{
      const b = $('#auth-body');
      if(mode==='login'){
        b.innerHTML = `
          <div class="field"><label>Username</label><input id="a-user" placeholder="username" autocomplete="username"></div>
          <div class="field"><label>Password</label>
            <div class="pw-wrap"><input id="a-pw" type="password" placeholder="••••••••" autocomplete="current-password">
              <button class="pw-toggle" type="button">${iconSvg('eye','')}</button></div>
          </div>
          <div class="hint">Guest progress tetap ada di perangkat ini.</div>
        `;
      } else {
        b.innerHTML = `
          <div class="field"><label>Username</label><input id="a-user" placeholder="username" autocomplete="username">
            <div class="hint" id="a-user-h"></div></div>
          <div class="field"><label>Email (opsional)</label><input id="a-email" placeholder="email" autocomplete="email"></div>
          <div class="field"><label>Password</label>
            <div class="pw-wrap"><input id="a-pw" type="password" placeholder="min 6 char">
              <button class="pw-toggle" type="button">${iconSvg('eye','')}</button></div></div>
          <div class="field"><label>Confirm Password</label>
            <div class="pw-wrap"><input id="a-pw2" type="password" placeholder="••••••••">
              <button class="pw-toggle" type="button">${iconSvg('eye','')}</button></div></div>
          <div class="hint">Dengan mendaftar, kau menyetujui Terms & Privacy.</div>
        `;
      }
      // pw toggles
      $$('#auth-body .pw-toggle').forEach(btn=>{
        btn.onclick = ()=>{
          const inp = btn.parentElement.querySelector('input');
          inp.type = inp.type==='password' ? 'text' : 'password';
          btn.innerHTML = iconSvg(inp.type==='password'?'eye':'eyeOff','');
        };
      });
    };
    $$('#auth-tabs .tab').forEach(t=>{
      t.onclick = ()=>{
        $$('#auth-tabs .tab').forEach(x=>x.classList.remove('on'));
        t.classList.add('on');
        mode = t.dataset.tab;
        $('#auth-submit').textContent = mode==='login'?'Login':'Register';
        render();
      };
    });
    $('#auth-close').onclick = ()=>{ UI.hidePanel(); UI.buildMenu(); };
    $('#auth-submit').onclick = async ()=>{
      const user = $('#a-user').value.trim();
      const pw = $('#a-pw').value;
      if(!user || !pw){ Toasts.show('Isi semua field.','err','warning'); return; }
      if(mode==='register'){
        const pw2 = $('#a-pw2').value;
        if(pw.length<6){ Toasts.show('Password min 6 karakter.','err','warning'); return; }
        if(pw !== pw2){ Toasts.show('Password tidak cocok.','err','warning'); return; }
        if(!FirebaseMan.ready){ Toasts.show('Server tidak tersedia.','err','error'); return; }
        try{
          const r = await FirebaseMan.register({username:user, password:pw, email:$('#a-email').value});
          // Upload current guest state to cloud
          SaveMan.user = r; SaveMan.isGuest = false;
          if(SaveMan.state) await FirebaseMan.saveProgress(r.uid, SaveMan.state);
          Toasts.show('Akun dibuat!','ok','check');
          UI.hidePanel(); UI.buildMenu();
        }catch(e){ Toasts.show(e.message||'Gagal daftar.','err','error'); }
      } else {
        if(!FirebaseMan.ready){ Toasts.show('Server tidak tersedia.','err','error'); return; }
        try{
          const r = await FirebaseMan.login({username:user, password:pw});
          SaveMan.user = r; SaveMan.isGuest = false;
          // load cloud save
          const cloud = await FirebaseMan.loadProgress(r.uid);
          if(cloud && (!SaveMan.state || cloud.level > SaveMan.state.level || confirm('Cloud save ditemukan. Muat cloud save? (Cancel = pakai lokal)'))) {
            SaveMan.state = SaveMan.validate(cloud);
            SaveMan.save(true);
          } else if(SaveMan.state){
            await FirebaseMan.saveProgress(r.uid, SaveMan.state);
          }
          Toasts.show('Login sukses!','ok','check');
          UI.hidePanel(); UI.buildMenu();
        }catch(e){ Toasts.show(e.message||'Login gagal.','err','error'); }
      }
    };
    render();
  },

  openInventory(){
    AudioMan.ui();
    const s = SaveMan.state;
    if(!s) return;
    const tabs = [
      {k:'all', label:'All'}, {k:'weapon', label:'Weapons'}, {k:'armor', label:'Armor'},
      {k:'accessory', label:'Acc.'}, {k:'consumable', label:'Use'}, {k:'material', label:'Mat.'}
    ];
    let curTab = 'all';
    const render = ()=>{
      const items = s.inventory.filter(i => curTab==='all' || ITEMS[i.id]?.type===curTab);
      if(items.length===0) return `<div class="empty">${iconSvg('bag','')}<div>Inventory masih kosong.</div></div>`;
      return '<div class="list">' + items.map(i=>{
        const it = ITEMS[i.id];
        if(!it) return '';
        const equipped = Object.values(s.equipped).includes(i.uid);
        const eq = equipped ? ' · EQUIPPED' : '';
        return `<div class="row b-${it.rarity}">
          <div class="ricon ${'r-'+it.rarity}">${iconSvg(it.icon,'')}</div>
          <div class="rmain">
            <div class="rtitle r-${it.rarity}">${it.name} ${i.qty>1?'×'+i.qty:''}${eq?' '+iconSvg('check',''):''}</div>
            <div class="rsub">${it.desc || ''}</div>
          </div>
          <div class="ractions">
            ${['weapon','armor','accessory'].includes(it.type) ? `<button class="btn sm ${equipped?'ghost':''}" data-act="equip" data-uid="${i.uid}">${equipped?'Unequip':'Equip'}</button>` : ''}
            ${it.type==='consumable' ? `<button class="btn sm" data-act="use" data-uid="${i.uid}">Use</button>` : ''}
            <button class="btn sm ghost" data-act="sell" data-uid="${i.uid}" ${it.rarity==='legendary'||it.rarity==='mythic'?'data-rare="1"':''}>${iconSvg('coin','')}</button>
          </div>
        </div>`;
      }).join('') + '</div>';
    };
    UI.show('panel-host');
    const p = $('#panel');
    p.innerHTML = `
      <div class="panel-head">${iconSvg('bag','')}<h2>Inventory</h2><button class="btn ghost sm" id="pclose" style="padding:6px">${iconSvg('close','')}</button></div>
      <div class="tabs" id="inv-tabs">${tabs.map(t=>`<button class="tab${t.k===curTab?' on':''}" data-k="${t.k}">${t.label}</button>`).join('')}</div>
      <div class="panel-body" id="inv-body"></div>
    `;
    const refresh = ()=>{ $('#inv-body').innerHTML = render(); attach(); };
    const attach = ()=>{
      $$('#inv-body [data-act]').forEach(b=>{
        b.onclick = ()=>{
          const uid2 = b.dataset.uid;
          const inv = s.inventory.find(x=>x.uid===uid2);
          if(!inv) return;
          const it = ITEMS[inv.id];
          if(b.dataset.act==='equip'){
            const slot = it.type;
            if(s.equipped[slot] === uid2){ s.equipped[slot] = null; }
            else { s.equipped[slot] = uid2; s.stats.equips++; }
            SaveMan.save(true); checkAchievements(); refresh();
          } else if(b.dataset.act==='use'){
            if(inv.id==='hp_potion'){ Player.heal(60); }
            else if(inv.id==='en_potion'){ Player.en = Math.min(Player.enMax, Player.en + 50); }
            else if(inv.id==='def_potion'){ Player.buffed.def = {type:'def', val:1.4, expires: performance.now()/1000 + 20}; }
            else if(inv.id==='spd_potion'){ Player.buffed.spd = {type:'spd', val:1.35, expires: performance.now()/1000 + 20}; }
            removeItem(uid2, 1); refresh();
          } else if(b.dataset.act==='sell'){
            if(b.dataset.rare){
              Modal.open({title:'Sell', icon:'warning', body:'Item langka. Yakin jual '+it.name+' ×1 senilai '+Math.floor(it.value*0.4)+'?',
                actions:[{label:'Cancel', kind:'ghost'},{label:'Sell', kind:'danger', onClick:()=>{ s.credits += Math.floor(it.value*0.4); removeItem(uid2,1); refresh(); }}]});
            } else { s.credits += Math.floor(it.value*0.4); removeItem(uid2,1); refresh(); }
          }
        };
      });
    };
    $$('#inv-tabs .tab').forEach(t=>{
      t.onclick = ()=>{ $$('#inv-tabs .tab').forEach(x=>x.classList.remove('on')); t.classList.add('on'); curTab = t.dataset.k; refresh(); };
    });
    $('#pclose').onclick = ()=>{ UI.hidePanel(); UI.buildMenu(); };
    refresh();
  },
  openSkills(){
    AudioMan.ui();
    const s = SaveMan.state;
    if(!s) return;
    const cats = ['combat','defense','mobility','energy','ultimate'];
    const catNames = {combat:'Combat', defense:'Defense', mobility:'Mobility', energy:'Energy', ultimate:'Ultimate'};
    const render = ()=>{
      let html = `<div class="stat" style="margin-bottom:10px"><span class="k">${iconSvg('star','')}Skill Points</span><span class="v">${s.skillPoints}</span></div>`;
      for(const cat of cats){
        const list = Object.entries(SKILLS).filter(([k,v])=>v.cat===cat);
        html += `<div style="margin-top:14px"><div style="font-size:11px;letter-spacing:.14em;color:var(--acc);font-weight:700;margin-bottom:6px">${catNames[cat].toUpperCase()}</div><div class="list">`;
        for(const [k,sk] of list){
          const owned = s.skills.includes(k);
          const canLearn = !owned && s.level >= sk.lvl && s.skillPoints >= sk.cost;
          html += `<div class="row">
            <div class="ricon">${iconSvg(sk.icon,'')}</div>
            <div class="rmain">
              <div class="rtitle">${sk.name}${owned?' '+iconSvg('check',''):''}</div>
              <div class="rsub">${sk.desc} · Lv ${sk.lvl} · ${sk.cost} SP${sk.cd>0?' · CD '+sk.cd+'s':''}</div>
            </div>
            ${owned ? '' : `<button class="btn sm ${canLearn?'primary':''}" data-skill="${k}" ${canLearn?'':'disabled'}>Learn</button>`}
          </div>`;
        }
        html += '</div></div>';
      }
      return html;
    };
    UI.show('panel-host');
    const p = $('#panel');
    p.innerHTML = `
      <div class="panel-head">${iconSvg('spark','')}<h2>Skills</h2><button class="btn ghost sm" id="pclose" style="padding:6px">${iconSvg('close','')}</button></div>
      <div class="panel-body" id="sk-body"></div>
    `;
    const refresh = ()=>{
      $('#sk-body').innerHTML = render();
      $$('#sk-body [data-skill]').forEach(b=>{
        b.onclick = ()=>{
          const k = b.dataset.skill;
          const sk = SKILLS[k];
          if(s.skillPoints >= sk.cost && s.level >= sk.lvl){
            s.skillPoints -= sk.cost;
            s.skills.push(k);
            Toasts.show('Learned: '+sk.name, 'ok', 'spark');
            checkAchievements();
            SaveMan.save();
            refresh();
          }
        };
      });
    };
    $('#pclose').onclick = ()=>{ UI.hidePanel(); UI.buildMenu(); };
    refresh();
  },
  openQuests(){
    AudioMan.ui();
    const s = SaveMan.state;
    if(!s) return;
    const all = Object.keys(s.quests).map(id=>QUESTS.find(q=>q.id===id)).filter(q=>q);
    const groups = {main:[], side:[], daily:[]};
    for(const q of all) groups[q.cat]?.push(q);
    const render = ()=>{
      const catNames = {main:'Main Quests', side:'Side Quests', daily:'Daily Quests'};
      let html = '';
      let any = false;
      for(const cat of ['main','side','daily']){
        if(groups[cat].length===0) continue;
        any = true;
        html += `<div style="font-size:11px;letter-spacing:.14em;color:var(--acc);font-weight:700;margin:10px 0 6px">${catNames[cat].toUpperCase()}</div><div class="list">`;
        for(const q of groups[cat]){
          const pr = s.quests[q.id];
          const prog = pr?.progress||0;
          html += `<div class="row">
            <div class="ricon">${iconSvg('scroll','')}</div>
            <div class="rmain">
              <div class="rtitle">${q.name}</div>
              <div class="rsub">${q.desc}</div>
              ${q.goal?`<div class="bar progress"><i style="width:${clamp(prog/q.goal*100,0,100)}%"></i></div>`:''}
            </div>
            <div style="font-size:11px;color:var(--dim);text-align:right">${q.goal?prog+'/'+q.goal:''}<br>+${q.reward.xp}XP +${q.reward.cr||0}cr</div>
          </div>`;
        }
        html += '</div>';
      }
      if(!any) html = `<div class="empty">${iconSvg('scroll','')}<div>Tidak ada quest aktif.</div></div>`;
      return html;
    };
    UI.openPanel('Quests','scroll',render());
    $('#pclose').onclick = ()=>{ UI.hidePanel(); UI.buildMenu(); };
  },

      s.music = parseFloat($('#set-music').value);
      s.sfx = parseFloat($('#set-sfx').value);
      s.ui = parseFloat($('#set-ui').value);
      s.joySize = parseInt($('#set-joy').value);
      s.btnSize = parseFloat($('#set-btn').value);
      s.textScale = parseFloat($('#set-txt').value);
      s.reduceMotion = $('#set-rm').value==='1';
      SaveMan.saveSettings();
      AudioMan.apply();
      // live updates
      const joy = $('#joy'); joy.style.width = s.joySize+'px'; joy.style.height = s.joySize+'px';
      document.documentElement.style.setProperty('--text-scale', s.textScale);
    };
    ['set-diff','set-dmg','set-shake','set-vib','set-q','set-part','set-master','set-music','set-sfx','set-ui','set-joy','set-btn','set-txt','set-rm'].forEach(id=>{
      const el2 = document.getElementById(id);
      if(el2) el2.addEventListener('input', apply);
      if(el2) el2.addEventListener('change', apply);
    });
    $('#set-reset').onclick = ()=>{
      Modal.open({title:'Reset Game Data', icon:'warning', body:'SEMUA progress, inventory, karakter, dan settings akan dihapus permanen. Lanjutkan?',
        actions:[
          {label:'Cancel', kind:'ghost'},
          {label:'Continue', kind:'danger', onClick:()=>{
            Modal.open({title:'Are you sure?', icon:'error', body:'Ini konfirmasi terakhir. Data tidak dapat dipulihkan.',
              actions:[
                {label:'Cancel', kind:'ghost'},
                {label:'DELETE ALL', kind:'danger', onClick:()=>{
                  SaveMan.reset();
                  Toasts.show('Data terhapus.', 'warn', 'trash');
                  UI.hidePanel(); UI.buildMenu(); UI.show('menu');
                }},
              ]});
          }},
        ]});
    };
    $('#set-debug').onclick = ()=>{ Game.debug = !Game.debug; UI.openSettings(); };
    $('#pclose').onclick = ()=>{ UI.hidePanel(); UI.buildMenu(); };
  },
  openCredits(){
    AudioMan.ui();
    const html = `
      <div style="text-align:center;padding:12px 0">
        <div style="font-size:20px;font-weight:800;letter-spacing:.16em;color:var(--acc)">NEXORA</div>
        <div style="font-size:11px;letter-spacing:.32em;color:var(--dim);margin-top:4px">SHADOW REALM</div>
        <div style="font-size:11px;color:var(--dim);margin-top:14px">v${GAME_CONFIG.version}</div>
        <div style="margin-top:22px;font-size:12px;line-height:1.8;color:var(--dim)">
          <div>Design & Development</div>
          <div style="color:var(--txt);font-weight:700">NEXORA STUDIO</div>
          <div style="margin-top:14px">Engine</div>
          <div style="color:var(--txt);font-weight:700">HTML5 Canvas + Web Audio</div>
          <div style="margin-top:14px">Cloud</div>
          <div style="color:var(--txt);font-weight:700">Firebase Realtime DB</div>
          <div style="margin-top:22px;font-size:11px;color:var(--dim)">Terima kasih telah bermain.</div>
        </div>
      </div>`;
    UI.openPanel('Credits','info',html);
    $('#pclose').onclick = ()=>{ UI.hidePanel(); UI.buildMenu(); };
  },
  buildPause(){
    const list = $('#pause-list');
    list.innerHTML = '';
    const items = [
      {icon:'play', label:'Resume', action:()=>Game.togglePause()},
      {icon:'bag', label:'Inventory', action:()=>{ Game.state='paused'; UI.openInventory(); }},
      {icon:'spark', label:'Skills', action:()=>{ Game.state='paused'; UI.openSkills(); }},
      {icon:'scroll', label:'Quests', action:()=>{ Game.state='paused'; UI.openQuests(); }},
      {icon:'trophy', label:'Achievements', action:()=>{ Game.state='paused'; UI.openAchievements(); }},
      {icon:'save', label:'Save', action:()=>{ SaveMan.save(); }},
      {icon:'settings', label:'Settings', action:()=>{ Game.state='paused'; UI.openSettings(); }},
      {icon:'logout', label:'Exit to Menu', danger:true, action:()=>{
        Modal.open({title:'Exit Game', icon:'warning', body:'Kembali ke menu? Progress tersimpan otomatis.',
          actions:[
            {label:'Cancel', kind:'ghost'},
            {label:'Exit', kind:'danger', onClick:()=>{
              SaveMan.save();
              Game.state = 'menu';
              UI.hidePause();
              UI.show('menu');
              UI.buildMenu();
              AudioMan.playTrack('menu');
            }},
          ]});
      }},
    ];
    for(const it of items){
      const b = el('button','menu-btn'+(it.danger?' danger':''));
      b.innerHTML = iconSvg(it.icon,'') + '<span>'+it.label+'</span>';
      b.onclick = ()=>{ AudioMan.ui(); it.action && it.action(); };
      list.appendChild(b);
    }
  },
  showPause(){ this.buildPause(); UI.show('pause'); },
  hidePause(){ $('#pause').classList.remove('on'); if(Game.state==='playing') UI.show('game'); },
  showDeath(){
    const html = `
      <h3>${iconSvg('warning','')}<span>You Died</span></h3>
      <p>Kegelapan menelamu. Namun Legacy tak berhenti di sini.</p>
      <div style="font-size:12px;color:var(--dim);margin-bottom:14px;text-align:center">Checkpoint terakhir akan memulihkanmu.</div>
    `;
    const bg = $('#modal-bg'), m = $('#modal');
    m.innerHTML = html;
    const btns = el('div','btns');
    const b1 = el('button','btn primary full','Respawn');
    b1.onclick = ()=>{ Modal.close(); Game.respawn(); };
    const b2 = el('button','btn ghost','Exit');
    b2.onclick = ()=>{ Modal.close(); Game.state='menu'; UI.show('menu'); UI.buildMenu(); AudioMan.playTrack('menu'); };
    btns.appendChild(b1); btns.appendChild(b2);
    m.appendChild(btns);
    bg.classList.add('on');
  },
  hideDeath(){ $('#modal-bg').classList.remove('on'); },
  showVictory(){
    const html = `
      <h3>${iconSvg('crown2','')}<span>The End</span></h3>
      <p>Shadow Core hancur. NEXORA kembali bercahaya.</p>
      <div style="font-size:12px;color:var(--dim);margin-bottom:14px;text-align:center">Kau telah menyelesaikan perjalanan Legacy.</div>
    `;
    const bg = $('#modal-bg'), m = $('#modal');
    m.innerHTML = html;
    const btns = el('div','btns');
    const b1 = el('button','btn primary full','Return to Menu');
    b1.onclick = ()=>{ Modal.close(); Game.state='menu'; UI.show('menu'); UI.buildMenu(); AudioMan.playTrack('menu'); };
    btns.appendChild(b1);
    m.appendChild(btns);
    bg.classList.add('on');
  }
};

// ---------------------------------------------------------------
// QUEST HOOKS
// ---------------------------------------------------------------
const _origKill = killEnemy;
killEnemy = function(e){
  _origKill(e);
  questProgress('kill');
  if(e.elite) questProgress('elite', {elite:true});
};
const _origOnBoss = onBossDefeated;
onBossDefeated = function(b){
  _origOnBoss(b);
  questProgress('boss', {boss:b.key});
};
const _origAddItem = addItem;
addItem = function(id, qty=1){
  _origAddItem(id, qty);
  questProgress('item', {itemId:id, qty});
};

// ---------------------------------------------------------------
// BOOT
// ---------------------------------------------------------------
async function boot(){
  SaveMan.loadSettings();
  const lbar = $('#load-bar'), lstatus = $('#load-status');
  const steps = [
    ['Initializing engine…', 300],
    ['Loading assets…', 320],
    ['Preparing world…', 300],
    ['Connecting database…', 500],
  ];
  let pct = 0;
  for(const [text, ms] of steps){
    lstatus.textContent = text;
    pct += 100/steps.length;
    lbar.style.width = pct+'%';
    await new Promise(r=>setTimeout(r, ms));
  }
  // init firebase
  await FirebaseMan.init();
  // init audio
  try{ AudioMan.init(); }catch(e){}
  lbar.style.width = '100%';
  lstatus.textContent = 'Ready.';
  await new Promise(r=>setTimeout(r, 250));

  // resume existing session?
  const saved = SaveMan.load();
  if(saved){ SaveMan.state = saved; }

  // setup
  Game.init();
  UI.show('menu');
  UI.buildMenu();
  AudioMan.playTrack('menu');

  // Splash → Loading → Menu
  // (splash already displayed; we skip loading screen here since it's quick)
  await new Promise(r=>setTimeout(r, 100));

  // Handle splash dismiss
  const splash = $('#splash');
  splash.addEventListener('click', ()=>{ AudioMan.resume(); AudioMan.ui(); showLoadingThenMenu(); }, { once:true });
  splash.addEventListener('touchstart', ()=>{ AudioMan.resume(); AudioMan.ui(); showLoadingThenMenu(); }, { once:true, passive:true });

  function showLoadingThenMenu(){
    splash.classList.remove('on');
    UI.show('loading');
    setTimeout(()=>{
      UI.show('menu');
      UI.buildMenu();
      AudioMan.playTrack('menu');
    }, 500);
  }

  // Fullscreen on tap (mobile)
  document.body.addEventListener('touchstart', ()=>{
    if(!document.fullscreenElement && document.documentElement.requestFullscreen && ('ontouchstart' in window)){
      // Not auto-fullscreen, let user trigger from settings menu
    }
  }, { passive:true });
}

// Also wire key handlers for shortcuts
window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(Game.state==='playing'){
    if(k==='escape'){ Game.togglePause(); }
    if(k==='i'){ Game.state='paused'; UI.openInventory(); }
    if(k==='q'){ Game.state='paused'; UI.openQuests(); }
    if(k==='m'){ /* Map not implemented as separate - no button shown */ }
    if(k==='e'){ Input.justPressed[Input.keymap.interact]=true; }
  } else if(Game.state==='paused' && k==='escape'){
    Game.togglePause();
  }
  if(k==='f1'){ e.preventDefault(); Game.debug=!Game.debug; }
});

// Rotate warning
function checkOrient(){
  const r = $('#rotate');
  if(window.innerWidth < 720 && window.innerHeight > window.innerWidth && Game.state==='playing'){
    r.style.display = 'flex';
  } else r.style.display = 'none';
}
window.addEventListener('resize', checkOrient);
window.addEventListener('orientationchange', ()=>setTimeout(checkOrient, 200));

// Save on unload
window.addEventListener('beforeunload', ()=>{
  if(SaveMan.state){ try{ SaveMan.state.hp = Player.hp; }catch(e){}; SaveMan.save(true); }
});
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && SaveMan.state){ try{ SaveMan.state.hp = Player.hp; }catch(e){}; SaveMan.save(true); }
});

// Boot when DOM ready
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

// Expose for debugging
window.NEXORA = { Game, SaveMan, Player, World, Particles, FirebaseMan, UI, AudioMan };

</script>
